nn:{week:'Veke 7 · Taktarter',tasks:['Finn taktarten','Flytt taktstrekane','Dansande taktar'],intro:['Høyr pulsen og aksentane. Kva taktart høyrer du?','Set taktstrekar der taktene skal slutte. Alle slag må få plass.','Lag fire taktar. Endre trykk og pausar, og høyr korleis taktarten kjennest.'],side:'Kort og konkret',blurb:'Høyr, ordne og bygg musikken. Opne hjelp ved behov.',help:'Hjelp',teacher:'For læraren',teacherText:'Privat prototype. Lærar bør sjekka lyd, musikalsk presisjon og mobilbruk før elevutprøving.',helps:['3/4 har tre fjerdedelsslag per takt. 4/4 har fire. 6/8 blir her høyrt som to grupper med tre åttandedelar.','Det er tolv fjerdedelsslag i rekkja. I 3/4 blir det fire taktar, i 4/4 tre. Plasser taktstrekar mellom slaga.','Prøv fyrst å markera den første pulsen i kvar takt. Bruk pause i nokre av dei andre posisjonane. I 6/8 er gruppene 3+3 åttandedelar.'],play:'▶ Høyr',stop:'■ Stopp',check:'Sjekk',next:'Neste oppgåve ›',prev:'‹ Førre',finish:'Veke 7 er fullført.',no:'Prøv igjen. Lytt ein gong til.',yes:'Rett! Ny rytme.',ready:'Klart! Gå vidare.',mark:'Marker taktstrek',clear:'Nullstill',repeat:'Gjenta avspeling',done:'Du har fullført veke 7.',beat:'Slag',bar:'Takt',round:'Oppgåve',of:'av',challenge:'Steg',strong:'Trykk',normal:'Slag',rest:'Pause',listenFirst:'Spel rytmen før du sjekkar.',missing:'Plasser alle taktstrekane først.',notcorrect:'Taktstrekane stemmer ikkje med taktarten.',accent:'Marker minst eitt sterkt slag og éin pause i kvar takt.',edit:'Gjer ei endring i minst to taktar før du spelar vidare.',playComplete:'Høyr heile rytmen for å fullføra.',one:'Trykk på ei rute for å byta mellom vanleg slag, trykk og pause.',success:'Bra! No prøver me neste taktart.',noSkip:'Oppgåva er låst.'},
nb:{week:'Uke 7 · Taktarter',tasks:['Finn taktarten','Flytt taktstrekene','Dansende takter'],intro:['Hør pulsen og aksentene. Hvilken taktart hører du?','Sett taktstreker der taktene skal slutte. Alle slag må få plass.','Lag fire takter. Endre trykk og pauser, og hør hvordan taktarten føles.'],side:'Kort og konkret',blurb:'Lytt, ordne og bygg musikken. Åpne hjelp ved behov.',help:'Hjelp',teacher:'For læreren',teacherText:'Privat prototype. Lærer må kontrollere musikk, lyd og mobil før elever prøver.',helps:['3/4 har tre fjerdedelsslag. 4/4 har fire. 6/8 høres her som to grupper med tre åttendedeler.','Det er tolv fjerdedelsslag. Sett taktstreker mellom dem, i 3/4 eller 4/4.','Prøv å markere første slag i hver takt og legg til pauser. 6/8 har to grupper med tre åttendedeler.'],play:'▶ Hør',stop:'■ Stopp',check:'Sjekk',next:'Neste oppgave ›',prev:'‹ Forrige',finish:'Uke 7 er fullført.',no:'Prøv igjen. Lytt en gang til.',yes:'Riktig! Ny rytme.',ready:'Klart! Gå videre.',mark:'Marker taktstrek',clear:'Nullstill',repeat:'Gjenta avspilling',done:'Du har fullført uke 7.',beat:'Slag',bar:'Takt',round:'Oppgave',of:'av',challenge:'Steg',strong:'Trykk',normal:'Slag',rest:'Pause',listenFirst:'Spill rytmen før du sjekker.',missing:'Plasser alle taktstrekene først.',notcorrect:'Taktstrekene stemmer ikke med taktarten.',accent:'Marker minst ett sterkt slag og én pause i hver takt.',edit:'Gjør en endring i minst to takter før du spiller videre.',playComplete:'Spill hele rytmen for å fullføre.',one:'Trykk på en rute for å bytte mellom vanlig slag, trykk og pause.',success:'Bra! Nå prøver vi neste taktart.',noSkip:'Oppgaven er låst.'},

let language='nn',task=0,complete=[false,false,false],count=0,question=null,barStage=0,barLines=new Set(),heard=false,createStage=0,created=null,previous=null,loop=false,audio=null,voices=[],timeout=null,playId=0;
const $=id=>document.getElementById(id),t=()=>dict[language];
function silence(){playId++;if(timeout)clearTimeout(timeout);timeout=null;for(const o of voices){try{o.stop()}catch(e){}}voices=[]}
function ctx(){audio||=new (window.AudioContext||window.webkitAudioContext)();audio.resume();return audio}
function notes(events,step=.35,onEnd){silence();let token=playId,c=ctx(),s=c.currentTime+.08;
 events.forEach((v,i)=>{if(!v)return;let tm=s+i*step;let o=c.createOscillator(),g=c.createGain();o.type=v===2?'triangle':'sine';o.frequency.value=v===2?440:330;let a=v===2?.19:.085;g.gain.setValueAtTime(.0001,tm);g.gain.linearRampToValueAtTime(a,tm+.006);g.gain.exponentialRampToValueAtTime(.0001,tm+step*.66);o.connect(g).connect(c.destination);o.start(tm);o.stop(tm+step*.7);voices.push(o)});
 if(onEnd)timeout=setTimeout(()=>{if(token===playId)onEnd()},Math.ceil((events.length*step+.2)*1000))}
function phrase(meter,variant=0){let pattern=meter==='3/4'?[2,1,1]:meter==='4/4'?[2,1,1,1]:[2,1,1,1,2,1];let seq=Array(4).fill(0).flatMap((_,j)=>pattern.map((v,i)=>i!==0&&i!==Math.floor(pattern.length/2)&&((j+variant+i)%5===0)?0:v));return seq}
function status(msg,good=false){$('status').textContent=msg;$('status').className='status'+(good?' success':'')}
function mark(){complete[task]=true;nav();$('next').disabled=false}
function nav(){$('steps').innerHTML=t().tasks.map((x,i)=>`<button ${i>0&&!complete[i-1]?'disabled':''} class="${task===i?'current':''}" data-task="${i}">${complete[i]?'✓ ':''}${i+1}. ${x}</button>`).join('');$('steps').querySelectorAll('button').forEach(b=>b.onclick=()=>goto(+b.dataset.task))}
function goto(i){if(i<0||i>2||i>0&&!complete[i-1])return;silence();task=i;draw()}
function draw(){let w=t();document.documentElement.lang=language;$('weekHead').textContent=w.week;$('sideTitle').textContent=w.side;$('sideBlurb').textContent=w.blurb;$('helpLabel').textContent=w.help;$('help').textContent=w.helps[task];$('teacherLabel').textContent=w.teacher;$('teacherText').textContent=w.teacherText;$('round').textContent=`${w.round.toUpperCase()} ${task+1} ${w.of.toUpperCase()} 3`;$('title').textContent=w.tasks[task];$('intro').textContent=w.intro[task];$('prev').textContent=w.prev;$('prev').disabled=task===0;$('next').textContent=task===2?w.finish:w.next;$('next').disabled=!complete[task];$('progress').textContent=task===0?`${count}/4`:task===1?`${barStage}/2`:`${createStage}/3`;nav();status('');if(task===0)draw1();else if(task===1)draw2();else draw3()}
let lastMeter='';
function fresh(){let options=['3/4','4/4','6/8'].filter(x=>x!==lastMeter);let meter=options[Math.floor(Math.random()*options.length)];lastMeter=meter;return {meter,events:phrase(meter,count),choices:['3/4','4/4','6/8']}}
function draw1(){let w=t();question||=fresh();$('progress').textContent=`${count}/4`;$('activity').innerHTML=`<div class="metric"><span class="counter">${count}/4</span><span>${w.play} · 4 ${w.bar.toLowerCase()}</span></div><div class="actions"><button class="primary" id="hear">${w.play} ▶</button><button id="stop">${w.stop}</button></div><div class="selectline">${question.choices.map(m=>`<button data-meter="${m}" style="min-width:95px;font-size:23px">${m}</button>`).join('')}</div><p class="small">3/4 · 4/4 · 6/8</p>`;
 $('hear').onclick=()=>notes(question.events,question.meter==='6/8'?.23:.35);$('stop').onclick=silence;
 $('activity').querySelectorAll('[data-meter]').forEach(b=>b.onclick=()=>{silence();if(b.dataset.meter===question.meter){count++;if(count>=4){mark();status(w.ready,true);$('progress').textContent='4/4';$('activity').querySelectorAll('[data-meter]').forEach(x=>x.disabled=true);return}question=fresh();draw1();status(w.yes,true)}else status(w.no)})}
function draw2(){let w=t(),meter=barStage===0?3:4,total=12,required=[...Array(total-1).keys()].map(x=>x+1).filter(x=>x%meter===0);$('progress').textContent=`${barStage}/2`;$('activity').innerHTML=`<div class="metric"><span class="counter">${barStage+1}/2</span><span style="font-size:22px;font-weight:800">${meter}/4</span><span>12 ${w.beat.toLowerCase()}</span></div><div class="beatgrid">${Array.from({length:12},(_,i)=>`<div class="beatbox">${i+1}</div>`).join('')}</div><div class="barlinegrid">${Array.from({length:11},(_,i)=>`<button data-pos="${i+1}" aria-pressed="${barLines.has(i+1)}" class="${barLines.has(i+1)?'isline':''}">${barLines.has(i+1)?'┃':'+'}</button>`).join('')}</div><div class="actions"><button id="hear" class="primary">${w.play}</button><button id="check">${w.check}</button><button id="reset">${w.clear}</button><button id="stop">${w.stop}</button></div><p class="small">${w.mark}: ${required.length}</p>`;
 $('activity').querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{let x=+b.dataset.pos;if(barLines.has(x))barLines.delete(x);else barLines.add(x);draw2()});$('hear').onclick=()=>notes(Array.from({length:12},(_,i)=>i%meter===0?2:1),.36);$('stop').onclick=silence;
 $('reset').onclick=()=>{barLines.clear();draw2()};
 $('check').onclick=()=>{if(barLines.size!==required.length){status(w.missing);return}if(!required.every(x=>barLines.has(x))){status(w.notcorrect);return}barStage++;barLines.clear();if(barStage===2){mark();status(w.ready,true);$('progress').textContent='2/2';$('activity').querySelectorAll('button').forEach(b=>b.disabled=true)}else{draw2();status(w.success,true)}}}
function initialise(meter){let size=meter==='6/8'?6:+meter[0];return Array.from({length:4},()=>Array.from({length:size},(_,i)=>i===0?2:1))}
function changes(){if(!previous)return 0;return created.reduce((acc,bar,i)=>acc+(bar.some((v,j)=>v!==previous[i][j])?1:0),0)}
function buildEvents(){return created.flat()}
function draw3(){let w=t(),meters=['3/4','4/4','6/8'],meter=meters[Math.min(2,createStage)];if(!created||created[0].length!==(meter==='6/8'?6:+meter[0])){created=initialise(meter);previous=created.map(b=>b.slice());heard=false}let finished=complete[2];$('progress').textContent=finished?'3/3':`${createStage+1}/3`;$('activity').innerHTML=`<div class="metric"><span class="counter">${w.challenge} ${finished?3:createStage+1}/3</span><span style="font-size:24px;font-weight:800">${meter}</span></div><p class="small">${w.one}</p>${created.map((bar,j)=>`<div class="tbar"><strong>${w.bar} ${j+1}</strong><div class="beats" style="grid-template-columns:repeat(${bar.length},minmax(0,1fr))">${bar.map((v,i)=>`<button data-slot="${j}:${i}" class="${v===2?'strong':v===0?'silent':''}" ${finished?'disabled':''}><strong>${v===2?'●':v===1?'·':'–'}</strong>${v===2?w.strong:v===1?w.normal:w.rest}</button>`).join('')}</div></div>`).join('')}<div class="actions"><button class="primary" id="hear" ${finished?'disabled':''}>${w.play} · 4 ${w.bar.toLowerCase()}</button><button id="stop">${w.stop}</button></div><p class="small">${finished?w.done:createStage===0?w.accent:createStage===1?w.edit:w.playComplete}</p>`;
 $('activity').querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{let [j,i]=b.dataset.slot.split(':').map(Number);created[j][i]=(created[j][i]+1)%3;heard=false;loop=false;silence();draw3()});
 
 $('stop').onclick=()=>{loop=false;silence()};
 $('hear').onclick=()=>{if(!created.every(bar=>bar.includes(2)&&bar.includes(0))){status(w.accent);return}if(createStage===1&&changes()<2){status(w.edit);return}let signal=JSON.stringify(created),stage=createStage;function finish(){if(task!==2||complete[2]||stage!==createStage||signal!==JSON.stringify(created))return;if(stage===2){loop=false;silence();createStage=3;mark();draw3();status(w.done,true)}else{createStage++;loop=false;silence();created=null;previous=null;draw3();status(w.success,true)}}
 let seq=buildEvents(),step=meter==='6/8'?.23:.35;
 // Repeats only when the user requests loop; progression playback itself must finish.
 notes(seq,step,finish);
 }
}
$('lang').onchange=e=>{language=e.target.value;draw()};$('prev').onclick=()=>goto(task-1);$('next').onclick=()=>{if(!complete[task])return;if(task===2){status(t().done,true)}else goto(task+1)};
const topbutton=$('topbtn');window.addEventListener('scroll',()=>topbutton.style.display=scrollY>320?'block':'none');topbutton.onclick=()=>scrollTo({top:0,behavior:'smooth'});
draw();
</script></body></html>
