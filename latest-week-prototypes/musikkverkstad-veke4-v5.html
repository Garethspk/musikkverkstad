function mk(tag,txt,cls='',click){let e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;if(click)e.onclick=click;return e}
function kb(nodes,selected,handler){let wrap=mk('div','','keyboard');nodes.forEach(n=>{let b=mk('button',n.label,'key'+(selected.includes(n.midi)?' on':''),()=>handler(n));b.setAttribute('aria-pressed',String(selected.includes(n.midi)));wrap.append(b)});return wrap}
function buildKeys(){return [...new Set([60,61,62,63,64,65,66,67,68,69,70,71,72,74])].map(m=>({midi:m,label:({60:'C',61:'C♯',62:'D',63:'D♯',64:'E',65:'F',66:'F♯',67:'G',68:'G♯',69:'A',70:'A♯',71:'H',72:'C',74:'D'})[m]}))}
function drawBuild(){
 let a=$('activity');a.innerHTML='';let r=buildRounds[round];
 let stages=mk('div','','stagebar');
 [0,1,2].forEach(j=>stages.append(mk('span',`${j+1}/3`,j===chosen.length?'stage now':j<chosen.length?'stage done':'stage')));
 a.append(stages);
 a.append(mk('p',`${t('round')} ${round+1} / 4 · ${t('target')} ${r.labels.join(' – ')}`,'tip'));
 a.append(mk('p',`${chosen.length}/3 · ${[t('first'),t('second'),t('third')][Math.min(chosen.length,2)]}`,'info'));
 a.append(kb(buildKeys(),chosen,n=>{
   if(chosen.includes(n.midi)){chosen=chosen.filter(m=>m!==n.midi);stop();}
   else if(chosen.length<3){chosen.push(n.midi);playChord(chosen);}
   else {setStatus(lang==='en'?'You have three notes. Tap a selected note to remove it.':lang==='nb'?'Du har valgt tre toner. Trykk på en valgt tone for å fjerne den.':'Du har valt tre tonar. Trykk på ein vald tone for å fjerna han.');return;}
   drawBuild();
 }));
 let bubbles=mk('div','','note-bubbles');chosen.forEach(n=>bubbles.append(mk('span',noteName(n),'bubble')));a.append(bubbles);
 let actions=mk('div','','actions');
 actions.append(mk('button',t('hear'),'primary',()=>playChord(chosen.length?chosen:[r.ns[0]])));
 actions.append(mk('button',t('start'),'secondary',()=>{chosen=[];stop();drawBuild()}));
 if(chosen.length===3){
  actions.append(mk('button',t('check'),'primary',()=>{
   const correct=chosen.length===r.ns.length&&chosen.every(n=>r.ns.includes(n));
   if(!correct){setStatus(lang==='en'?'Not quite. Change a note and try again.':lang==='nb'?'Ikke helt. Bytt en tone og prøv igjen.':'Ikkje heilt. Byt ein tone og prøv igjen.');return;}
   stop();
   if(round===3){finish();return;}
   round++;chosen=[];drawBuild();setStatus(t('tryanother'),true);
  }));
 }
 a.append(actions);
}
function drawTransform(){
 const a=$('activity');a.innerHTML='';
 const r=transformRounds[Math.min(round,3)];
 // Stage 1 and 2 use C. The later stage offers different chords in each round.
 const base=transformStage<2?transformRounds[0]:r;
 if(transform===null)transform=base.third;
 const stages=mk('div','','stagebar');
 ['explore','compareStage','recreateStage'].forEach((k,i)=>stages.append(mk('span',t(k),i===transformStage?'stage now':i<transformStage?'stage done':'stage')));
 a.append(stages);
 if(transformStage===0)a.append(mk('p',t('exploreHint'),'tip'));
 if(transformStage===1)a.append(mk('p',t('compareHint'),'tip'));
 if(transformStage===2)a.append(mk('p',`${t('round')} ${round+1}/3 · ${t('recreateHint')}`,'tip'));
 const row=mk('div','','triad');
 row.append(mk('span',noteName(base.root),'bubble'));
 const controls=mk('div','','middle-controls');
 controls.append(mk('div',t('middle'),'small'));
 const movement=mk('div','','actions');
 const down=mk('button','↓ '+t('down'),'rotate',()=>move(-1));
 const value=mk('span',noteName(transform),'bubble');value.setAttribute('aria-live','polite');
 const up=mk('button','↑ '+t('up'),'rotate',()=>move(1));
 movement.append(down,value,up);controls.append(movement);
 row.append(controls,mk('span',noteName(base.fifth),'bubble'));a.append(row);
 const acts=mk('div','','actions');
 acts.append(mk('button',t('playBefore'),'',()=>playChord([base.root,base.third,base.fifth])));
 if(transformStage===0){
   acts.append(mk('button',t('modified'),'primary',()=>{heardChanges.add(transform);playChord([base.root,transform,base.fifth])}));
   acts.append(mk('button',t('advance'),'primary',()=>{
     if(!explored.has(-1)||!explored.has(1)||!heardChanges.has(base.third-1)||!heardChanges.has(base.third+1)){setStatus(t('mustExplore'));return}
     transformStage=1;transform=null;drawTransform();setStatus(t('compareHint'),true);
   }));
 }else{
   let target=transformStage===1?base.third-1:base.targetThird;
   acts.append(mk('button',t('listenTarget'),'primary',()=>playChord([base.root,target,base.fifth])));
   acts.append(mk('button',t('listenYours'),'',()=>playChord([base.root,transform,base.fifth])));
   acts.append(mk('button',t('checkSound'),'primary',()=>{
     if(transform!==target){setStatus(t('tryAgain'));return}
     stop();
     if(transformStage===1){transformStage=2;round=0;transform=null;drawTransform();setStatus(t('compareOk'),true)}
     else if(round>=2){finish();setStatus(t('stageDone'),true)}
     else {round++;transform=null;drawTransform();setStatus(t('roundGood'),true)}
   }));
 }
 a.append(acts);
 function move(delta){
   let next=transform+delta;
   if(next<base.third-2||next>base.third+2){return}
   transform=next;
   if(transformStage===0)explored.add(delta);
   playChord([base.root,transform,base.fifth]);
   drawTransform();
 }
}
function noteName(midi){return ({60:'C',61:'C♯',62:'D',63:'D♯',64:'E',65:'F',66:'F♯',67:'G',68:'G♯',69:'A',70:'A♯',71:'H',72:'C',73:'C♯',74:'D',75:'D♯'})[midi]||String(midi)}
function drawSequence(){
 let a=$('activity');a.innerHTML='';
 if(weekCelebrated){
   let box=mk('div','','donebox');box.setAttribute('role','status');
   box.append(mk('h2',t('weekCelebrate')));
   box.append(mk('p',t('weekCelebrateDetail')));
   box.append(mk('p',t('noWrong'),'small'));
   a.append(box);$('next').disabled=true;$('next').textContent=t('finished');return;
 }
 let stages=mk('div','','stagebar');['stage1','stage2','stage3'].forEach((k,j)=>stages.append(mk('span',t(k),j===Math.min(phase,2)?'stage now':j<phase?'stage done':'stage')));a.append(stages);
 if(phase===3){
   let box=mk('div','','donebox');box.setAttribute('role','status');box.append(mk('h3',t('weekReady')));box.append(mk('p',t('noWrong')));a.append(box);
   a.append(mk('button',t('weekFinish'),'primary',()=>{weekCelebrated=true;stop();drawSequence();setStatus('')}));
   return;
 }
 a.append(mk('p',phase===2?t('finalPrompt'):t('arrange'),'info'));
 let cards=mk('div','','sequence');
 seq.forEach((index,k)=>{
   let card=mk('div','','seqcard');card.append(mk('span',`${k+1}.`,'small'));card.append(mk('strong',chords[index].name));card.append(mk('div',chords[index].ns.map(noteName).join(' · '),'small'));
   if(phase<2){let btns=mk('div','','actions');btns.append(mk('button','◀','',()=>{stop();seq[k]=(seq[k]+chords.length-1)%chords.length;if(phase===1)editedPlayed=false;drawSequence()}));btns.append(mk('button','▶','',()=>{stop();seq[k]=(seq[k]+1)%chords.length;if(phase===1)editedPlayed=false;drawSequence()}));btns.append(mk('button','♪','',()=>playChord(chords[index].ns)));card.append(btns)}
   cards.append(card)
 });a.append(cards);
 let actions=mk('div','','actions');
 if(phase<2){
   actions.append(mk('button',t('listena'),'primary',()=>{playProgression();if(phase===0)previewed=true;else editedPlayed=true}));
   actions.append(mk('button',t('stop'),'',()=>stop()));a.append(actions);
   let lab=mk('label','','loop');let cb=document.createElement('input');cb.type='checkbox';cb.checked=loop;cb.onchange=()=>{loop=cb.checked};lab.append(cb,document.createTextNode(t('loop')));a.append(lab);
   let action2=mk('div','','actions');
   if(phase===0){action2.append(mk('button',t('stage2'),'primary',()=>{if(!previewed){setStatus(t('playfirst'));return}stop();firstSeq=seq.join(',');phase=1;drawSequence();setStatus(t('changed'))}))}
   else {action2.append(mk('button',t('stage3'),'primary',()=>{if(seq.join(',')===firstSeq){setStatus(t('choosefirst'));return}if(!editedPlayed){setStatus(t('listennew'));return}stop();phase=2;comparisonHeardOriginal=false;comparisonHeardEdited=false;loop=false;drawSequence();setStatus('')}))}
   a.append(action2);
 }else{
   const original=firstSeq.split(',').map(Number),edited=seq.slice();
   const compare=mk('div','','actions');
   compare.append(mk('button',t('replayOriginal'),'primary',()=>{stop();let saved=seq;seq=original;playProgression();seq=saved;comparisonHeardOriginal=true}));
   compare.append(mk('button',t('replayEdited'),'primary',()=>{stop();playProgression();comparisonHeardEdited=true}));
   compare.append(mk('button',t('stop'),'',()=>stop()));a.append(compare);
   let prefs=mk('div','','actions');
   for(const key of ['preferOriginal','preferEdited']){prefs.append(mk('button',t(key),'primary',()=>{
     if(!comparisonHeardOriginal||!comparisonHeardEdited){setStatus(t('needChoice'));return}
     stop();phase=3;finish();drawSequence();setStatus('');
   }))}
   a.append(prefs);
 }
}
$('lang').onchange=e=>{lang=e.target.value;stop();updateLocale()};$('back').onclick=()=>{if(task>0)go(task-1)};$('next').onclick=()=>{if(!completed[task])return;if(task<2){go(task+1)}else{weekCelebrated=true;stop();drawSequence();setStatus('')}};$('topbtn').onclick=()=>scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',()=>$('topbtn').style.display=window.scrollY>250?'block':'none');updateLocale();
</script></body></html>
