function done(){completed[task]=true;$('next').disabled=false;renderNav();status(T().unlock,'success')}
function renderActivity(){if(task===0)renderCompare();if(task===1)renderOrder();if(task===2)renderMemory()}
function compareData(){let r=COMPARE[compareRound%COMPARE.length],changed=r.slice(),pos=changed.length-1-(compareRound%3);changed[pos]=changed[pos]>=69?changed[pos]-2:changed[pos]+2;let matchA=compareRound%2===0;return {r,changed,matchA}}
function renderCompare(){let t=T(),d=compareData();$('progress').textContent=`${t.round}: ${compareRound}/4`;$('activity').innerHTML=`<div class="controls"><button id="ref" class="primary bigaction">${t.playRef}</button><span class="chip">${compareRound+1} / 4</span></div><div class="choicecards"><div class="choicecard"><strong>A</strong><button id="playA">${t.playA}</button><button id="answerA" class="primary">${t.choose} A</button></div><div class="choicecard"><strong>B</strong><button id="playB">${t.playB}</button><button id="answerB" class="primary">${t.choose} B</button></div></div>`;$('ref').onclick=()=>play(d.r);$('playA').onclick=()=>play(d.matchA?d.r:d.changed);$('playB').onclick=()=>play(d.matchA?d.changed:d.r);$('answerA').onclick=()=>answerCompare(d.matchA);$('answerB').onclick=()=>answerCompare(!d.matchA)}
function answerCompare(ok){if(completed[0])return;if(!ok){compareTrials++;status(T().wrong,'error');return}compareRound++;compareTrials=0;if(compareRound===4){done();$('progress').textContent=`${T().round}: 4/4`;status(T().compareDone,'success');$('answerA').disabled=$('answerB').disabled=true}else{renderCompare();status(T().right,'success')}}
function phraseSet(){return PARTS.slice(0,(orderStage+1)*3)}
function initOrder(){order=shuffled(3,132)}
function addNextPhrases(){
  // Keep solved bars in order, and shuffle only the three newly introduced phrases.
  const previous=(orderStage+1)*3;
  orderStage++;
  order=Array.from({length:previous},(_,i)=>i).concat(shuffled(3,132+orderStage*51).map(i=>previous+i));
}
function shiftPhrase(i,j){if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];renderOrder()}
// Short phrases use one quarter note per pitch. Positions match treble-clef notation.
function phraseStaff(pitches){
 const ys={60:80,62:70,64:60,65:55,67:50,69:45,71:40,72:35,74:30,76:25};
 const lines=[20,30,40,50,60].map(y=>`<line x1="9" y1="${y}" x2="143" y2="${y}" stroke="#475c70" stroke-width="1.4"/>`).join('');
 const heads=pitches.map((p,i)=>{
   const y=ys[p];if(y===undefined)return '';
   const x=33+i*40;
   return `${y>=80?`<line x1="${x-13}" y1="80" x2="${x+13}" y2="80" stroke="#273d51" stroke-width="1.5"/>`:''}<ellipse cx="${x}" cy="${y}" rx="8" ry="5.1" transform="rotate(-22 ${x} ${y})" fill="#142c3e"/><line x1="${x+7}" y1="${y}" x2="${x+7}" y2="${y-29}" stroke="#142c3e" stroke-width="2.5"/>`;
 }).join('');
 return `<svg class="phrase-staff" viewBox="0 0 153 93" role="img" aria-label="${lang==='en'?'Three notes on a staff':lang==='nb'?'Tre noter på notesystem':'Tre notar på notesystem'}"><rect width="153" height="93" rx="7" fill="#f4f7f5"/>${lines}${heads}</svg>`;
}
function renderOrder(){let t=T(),parts=phraseSet(),n=parts.length;if(!order.length)initOrder();$('progress').textContent=`${t.stage} ${orderStage+1}/3`;$('activity').innerHTML=`<div class="controls"><button class="primary" id="original">${t.original}</button><button id="mine">${t.all}</button><span class="chip">${n} ${lang==='en'?'phrases':lang==='nb'?'fraser':'frasar'}</span></div><p class="notehelp">${t.reorderHint}</p><div class="phrases" id="phraseList">${order.map((id,i)=>`<div class="phrase" draggable="true" data-position="${i}"><div class="phrasehead"><strong>${i+1}</strong><span class="chip">♫</span></div>${phraseStaff(parts[id])}<div class="phcontrols"><button data-play="${i}" aria-label="${t.part} ${i+1}">▶ ${t.part}</button><button data-left="${i}" aria-label="Move phrase left" ${i===0?'disabled':''}>←</button><button data-right="${i}" aria-label="Move phrase right" ${i===n-1?'disabled':''}>→</button></div></div>`).join('')}</div><button class="primary bigaction" id="checkOrder">${t.check}</button>`;
 $('original').onclick=()=>play(parts.flatMap(p=>[...p,null]),.30);$('mine').onclick=()=>play(order.flatMap(id=>[...parts[id],null]),.30);$('checkOrder').onclick=checkOrder;
 document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(parts[order[+b.dataset.play]],.34));document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>shiftPhrase(+b.dataset.left,+b.dataset.left-1));document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>shiftPhrase(+b.dataset.right,+b.dataset.right+1));
 document.querySelectorAll('.phrase').forEach(card=>{card.ondragstart=e=>{e.dataTransfer.setData('text/plain',card.dataset.position);e.dataTransfer.effectAllowed='move';card.classList.add('dragging')};card.ondragend=()=>card.classList.remove('dragging');card.ondragover=e=>{e.preventDefault();card.classList.add('dropover')};card.ondragleave=()=>card.classList.remove('dropover');card.ondrop=e=>{e.preventDefault();card.classList.remove('dropover');let from=Number(e.dataTransfer.getData('text/plain')),to=Number(card.dataset.position);if(Number.isInteger(from)&&from>=0&&from<order.length&&to>=0&&to<order.length){let item=order.splice(from,1)[0];order.splice(to,0,item);renderOrder()}}});}
function checkOrder(){if(completed[1])return;if(!order.every((v,i)=>v===i)){status(T().orderWrong,'error');return}if(orderStage<2){const message=orderStage===0?T().order1:T().order2;addNextPhrases();renderOrder();status(message,'success')}else{done();status(T().order3,'success');$('checkOrder').disabled=true}}
function expectedMelody(){return MEMORY[melRound%MEMORY.length]}
function enter(p){if(completed[2]||entry.length>=4)return;entry.push(p);play([p],.32);renderMemory()}
function renderMemory(){let t=T();$('progress').textContent=`${t.round}: ${streak}/3`;$('activity').innerHTML=`<div class="controls"><button class="primary bigaction" id="listen">${t.listen}</button><span class="chip">${t.round}: ${streak}/3</span></div><div class="melodyline"><div class="eyebrow">${t.fourNotes}</div><div class="entered">${entry.map(p=>`<span class="notechip">${NAMES[PITCHES.indexOf(p)]}</span>`).join('')||`<span class="notehelp">${t.notesHint}</span>`}</div><div class="keyboard">${PITCHES.map((p,i)=>`<button data-pitch="${p}" aria-label="${NAMES[i]}">${NAMES[i]}</button>`).join('')}</div><div class="controls"><button id="undo" ${entry.length?'':'disabled'}>${t.undo}</button><button id="clear" ${entry.length?'':'disabled'}>${t.clear}</button><button id="playMine" ${entry.length?'':'disabled'}>${t.playYours}</button><button id="checkNotes" class="primary" ${entry.length===4?'':'disabled'}>${t.checkNotes}</button></div></div>`;$('listen').onclick=()=>play(expectedMelody(),.42);document.querySelectorAll('[data-pitch]').forEach(b=>b.onclick=()=>enter(+b.dataset.pitch));$('undo').onclick=()=>{entry.pop();renderMemory()};$('clear').onclick=()=>{entry=[];renderMemory()};$('playMine').onclick=()=>play(entry,.42);$('checkNotes').onclick=checkMemory}
function checkMemory(){if(entry.length!==4||completed[2])return;let correct=entry.every((p,i)=>p===expectedMelody()[i]);melRound++;entry=[];if(correct){streak++;if(streak===3){done();renderMemory();$('next').disabled=false;status(T().melRight3,'success');return}renderMemory();status(streak===1?T().melRight1:T().melRight2,'success')}else{streak=0;renderMemory();status(T().melWrong,'error')}}
$('toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',()=>{$('toTop').classList.toggle('visible',window.scrollY>240)},{passive:true});
$('lang').onchange=e=>{lang=e.target.value;refresh()};$('back').onclick=()=>navigate(task-1);$('next').onclick=()=>{if(!completed[task])return;if(task<2)navigate(task+1);else status(T().finish,'success')};$('restart').onclick=()=>{if(!confirm(T().resetConfirm))return;stopAudio();task=0;completed=[false,false,false];compareRound=0;compareTrials=0;orderStage=0;order=[];entry=[];streak=0;melRound=0;refresh()};refresh();
</script></body></html>
