function onTap(){if(!pulseRunning)return;const now=performance.now()-pulseStart;if(now>=4*pulseDuration&&now<12*pulseDuration){pulseTimes.push(now);$('tapcount').textContent=`${T().pulseCount}: ${pulseTimes.length}`}}
function scorePulse(){// Success requires >=5 valid taps, median proximity to beat <~185ms, and coverage over four or more beats.
 let err=pulseTimes.map(ms=>{let phase=((ms%pulseDuration)+pulseDuration)%pulseDuration;return Math.min(phase,pulseDuration-phase)});let hits=err.filter(e=>e<175).length;let covered=new Set(pulseTimes.filter((ms,i)=>err[i]<175).map(ms=>Math.round(ms/pulseDuration))).size;const ok=hits>=5&&covered>=5&&hits/Math.max(1,pulseTimes.length)>=.65;if(ok){completed[0]=true;show(T().pulseSuccess,'success');renderNav();$('next').disabled=false;$('progress').textContent='✓'}else show(T().pulseRetry,'error')}
function seedQuiz(){quizQueue=[];const order=[1,2,3,5,6,0,7,4];let rot=(quizIdx*3+quizCount)%order.length;for(let i=0;i<order.length;i++)quizQueue.push(order[(i+rot)%order.length]);}
function renderQuiz(){const t=T();quizLocked=false;if(!quizQueue.length)seedQuiz();$('progress').textContent=`${t.quizStep}: ${quizCount}/5`;const id=quizQueue[0];$('activity').innerHTML=`<div class="notearea"><svg viewBox="0 0 480 134" aria-label="${t.noteTypes[id]}" role="img"><g stroke="#b6bec0" stroke-width="2">${[24,44,64,84,104].map(y=>`<line x1="24" x2="456" y1="${y}" y2="${y}"/>`).join('')}</g><g transform="translate(165,-1) scale(1.45)">${noteSvg(id).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g></svg></div><h3>${t.quizQuestion}</h3><div class="answers">${[.5,1,2,4].map(v=>`<button data-v="${v}">${v===.5?'½':v} ${t.beats}</button>`).join('')}</div>`;$('activity').querySelectorAll('.answers button').forEach(b=>b.onclick=()=>onQuiz(+b.dataset.v,b));}
function onQuiz(v,b){if(completed[1]||quizLocked)return;const t=T(),id=quizQueue[0],ok=ALL[id].duration===v;if(!ok){quizMistakes++;quizCorrectFirst=false;b.classList.add('wrong');show(t.quizWrong,'error');if(quizMistakes===2)offerDifficulty(false);return}quizLocked=true;b.classList.add('correct');quizCount++;show(quizCount===5?t.quizDone:t.quizRight,'success');quizQueue.shift();if(quizCount>=5){completed[1]=true;renderNav();$('next').disabled=false;$('progress').textContent=`${t.quizStep}: 5/5`;$('adapt').innerHTML='';return}setTimeout(()=>{if(task===1&&!completed[1]){quizMistakes=0;$('adapt').innerHTML='';renderQuiz()}},570)}
function offerDifficulty(harder){const t=T();let a=$('adapt');a.innerHTML=`<div class="status"><p>${harder?t.difficultyH:t.difficultyE}</p><button id="adjust" class="primary">${harder?t.tryHard:t.tryEasy}</button> <button id="dismiss">${t.no}</button></div>`;$('adjust').onclick=()=>{quizDifficulty+=harder?1:-1;quizQueue=[];seedQuiz();renderQuiz();a.innerHTML=''};$('dismiss').onclick=()=>a.innerHTML=''}
function restCount(){return bars.flat().filter(id=>ALL[id].rest).length}
function changedSinceBaseline(){return JSON.stringify(bars)!==JSON.stringify(buildBaseline)}
function barSum(i){return bars[i].reduce((a,id)=>a+ALL[id].duration,0)}
function selectTile(id){selectedTile=id;document.querySelectorAll('.pal').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.tile===id)))}
function appendToBar(i,id=selectedTile){if(completed[2])return;const room=4-barSum(i);if(ALL[id].duration>room+.00001){show(T().buildOverflow,'error');return}bars[i].push(id);playedBuild=false;renderBuild();if(bars.every((b,i)=>barSum(i)===4))show(T().buildGood,'success')}
function renderBuild(){const t=T();$('progress').textContent=`${Math.min(3,buildRound+1)}/3`; $('taskInstruction').textContent=t.buildStages[Math.min(2,buildRound)];
 $('activity').innerHTML=`<div class="small">${t.buildHint}</div><div class="eyebrow" style="margin-top:12px">${t.palette}</div><div class="palette" id="palette">${ALL.map((n,i)=>`<button class="pal" draggable="true" data-tile="${i}" aria-pressed="${i===selectedTile}">${noteSvg(i,true)}<span>${t.noteTypes[i]} · ${n.duration===.5?'½':n.duration}</span></button>`).join('')}</div><div class="gridbars" id="bars">${bars.map((items,i)=>`<div class="bar" data-bar="${i}" tabindex="0" role="button" aria-label="${t.bar} ${i+1}, ${barSum(i)} ${t.beats}"><div class="barhead">${t.bar} ${i+1}<span class="chip">${barSum(i)}/4 ${t.beats}</span></div><div class="baritems">${items.map((id,j)=>`<div class="tile">${noteSvg(id,true)}<span class="tiny">${ALL[id].duration===.5?'½':ALL[id].duration}</span><button data-remove="${i}:${j}" aria-label="Remove">×</button></div>`).join('')||`<div class="placeholder">${t.barEmpty}</div>`}</div></div>`).join('')}</div><div class="controls"><button class="primary" id="playbars" ${bars.every((b,i)=>barSum(i)===4)?'':'disabled'}>${t.play}</button><button id="undo" class="secondary">${t.undo}</button><button id="clear" class="secondary">${t.clear}</button><label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:42px"><input type="checkbox" id="loopbars" ${loopBuild?'checked':''} style="width:19px;height:19px;accent-color:var(--lime)">${lang==='en'?'Repeat playback':lang==='nb'?'Gjenta avspilling':'Gjenta avspeling'}</label><button id="stopbars" class="secondary" ${buildPlaying?'':'disabled'}>${lang==='en'?'■ Stop':lang==='nb'?'■ Stopp':'■ Stopp'}</button></div>`;
 document.querySelectorAll('.pal').forEach(b=>{b.onclick=()=>selectTile(+b.dataset.tile);b.ondragstart=e=>{e.dataTransfer.setData('text/plain',b.dataset.tile);e.dataTransfer.effectAllowed='copy'}});
 document.querySelectorAll('.bar').forEach(b=>{const i=+b.dataset.bar;b.onclick=e=>{if(e.target.closest('[data-remove]'))return;appendToBar(i)};b.onkeydown=e=>{if(e.target===b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();appendToBar(i)}};b.ondragover=e=>{e.preventDefault();b.dataset.drop='true'};b.ondragleave=()=>delete b.dataset.drop;b.ondrop=e=>{e.preventDefault();delete b.dataset.drop;const val=e.dataTransfer.getData('text/plain');if(/^[0-7]$/.test(val))appendToBar(i,+val)}});
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();let [i,j]=b.dataset.remove.split(':').map(Number);bars[i].splice(j,1);playedBuild=false;renderBuild()});$('undo').onclick=()=>{for(let i=3;i>=0;i--)if(bars[i].length){bars[i].pop();renderBuild();return}};$('clear').onclick=()=>{bars=[[],[],[],[]];playedBuild=false;renderBuild()};$('playbars').onclick=playBars;$('loopbars').onchange=e=>{loopBuild=e.target.checked};$('stopbars').onclick=()=>{if(!buildPlaying)return;stopSound();buildPlaying=false;if(buildCycles>0)finishBuildRound();else{playedBuild=false;renderBuild()}}}
function finishBuildRound(){if(!buildPlaying&& !playedBuild)return;buildPlaying=false;playedBuild=false;const finishedRound=buildRound;buildRound++;buildBaseline=bars.map(b=>b.slice());buildRestCount=restCount();if(buildRound>=3){completed[2]=true;renderNav();$('next').disabled=false;$('progress').textContent='✓';renderBuild();show(T().buildRoundSuccess[2],'success')}else{renderBuild();show(T().buildRoundSuccess[finishedRound],'success')}}
async function playBars(){if(buildPlaying)return;if(!bars.every((_,i)=>barSum(i)===4))return show(T().buildIncomplete,'error');if(!bars.flat().some(id=>ALL[id].rest)){show(lang==='en'?'Add at least one rest before playing.':lang==='nb'?'Legg inn minst én pause før du spiller.':'Legg inn minst éin pause før du spelar.','error');return}if(buildRound===1&&!changedSinceBaseline())return show(T().buildChange,'error');if(buildRound===2&&restCount()<=buildRestCount)return show(T().buildRestMore,'error');stopSound();await context();buildPlaying=true;playedBuild=true;buildCycles=0;const token=playToken;const duration=Math.ceil(16*.36*1000)+140;const $play=$('playbars'),$stop=$('stopbars');$play.disabled=true;$stop.disabled=false;
function cycle(){if(token!==playToken||task!==2||!buildPlaying)return;const starts=audio.currentTime+.08;let beat=0;for(let bi=0;bi<4;bi++){for(const id of bars[bi]){const n=ALL[id];if(!n.rest)toneAt(starts+beat*.36,bi%2===0?392:440,Math.max(.08,n.duration*.36-.05),.12,'triangle');beat+=n.duration}}setTimeout(()=>{if(token!==playToken||task!==2||!buildPlaying)return;buildCycles++;if(loopBuild){cycle()}else{buildPlaying=false;finishBuildRound()}},duration)}cycle()}
$('lang').onchange=e=>{lang=e.target.value;render()};$('back').onclick=()=>navigate(task-1);$('next').onclick=()=>{if(task<2&&completed[task])navigate(task+1);else if(task===2&&completed[2])show(T().finish,'success')};$('restart').onclick=()=>{if(!confirm(T().restartConfirm))return;stopSound();pulseRun++;task=0;completed=[false,false,false];quizCount=0;quizIdx=0;quizQueue=[];quizMistakes=0;bars=[[],[],[],[]];playedBuild=false;buildRound=0;buildBaseline=null;buildRestCount=0;render()};render();
</script></body></html>
