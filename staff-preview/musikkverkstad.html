const $=id=>document.getElementById(id),text=()=>words[locale];
function labels(){document.documentElement.lang=locale;const w=text();$('weekLabel').textContent=w.week;$('languageLabel').textContent=w.language;$('reset').textContent=w.reset;$('full').textContent=w.full;$('helpTitle').textContent=w.help;$('help').textContent=w.description;$('warning').textContent=w.blocked;$('week').innerHTML=titles[locale].map((t,i)=>`<option value="${i+1}" ${week===i+1?'selected':''}>${w.week} ${i+1} · ${t}${state[i].every(Boolean)?' ✓':''}</option>`).join('');const total=state.flat().filter(Boolean).length;$('status').textContent=(total===21?w.programmeDone+' ':week===7&&state[6].every(Boolean)?w.lastWeekDone+' ':'')+w.completed+': '+total+'/21'}
function mount(){resetPending=false;session=Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');const source=new TextDecoder().decode(Uint8Array.from(atob(BANK[week-1]),c=>c.charCodeAt(0)));frame=document.createElement('iframe');frame.title=titles[locale][week-1];frame.dataset.week=String(week);frame.dataset.ready='false';frame.inert=true;for(const id of ['week','language','reset'])$(id).disabled=true;frame.setAttribute('sandbox','allow-scripts');const boot=JSON.stringify({week,locale,completed:state[week-1],session}).replaceAll('<','\\u003c');frame.srcdoc=source.replace('/* BOOT_CONFIG */',boot);$('host').replaceChildren(frame);labels();window.scrollTo(0,0)}
