<script>
(()=>{const menus=[...document.querySelectorAll('.toolbar-menu')];
function closeMenus(except){menus.forEach(m=>{if(m!==except)m.open=false})}
menus.forEach(m=>m.querySelector('summary').addEventListener('click',()=>closeMenus(m)));
document.addEventListener('click',e=>{if(!e.target.closest('.toolbar-menu')||e.target.closest('[data-go]'))closeMenus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const open=menus.find(m=>m.open);closeMenus();if(open)open.querySelector('summary').focus()}});
})();
</script>

function staff(notes){const natural=[0,2,4,5,7,9,11];const y=m=>{let oct=Math.floor(m/12)-1,pc=m%12,idx=pc===10?6:natural.reduce((a,n,i)=>n<=pc?i:a,0);return 88-((oct-4)*7+idx-2)*5};const width=Math.max(300,notes.length*48+45);return `<div class="staff" aria-label="Notebilde av svaret ditt"><svg viewBox="0 0 ${width} 125" role="img" aria-label="Svaret ditt på notelinjer, G-nøkkel"><text x="7" y="83" font-size="51" font-family="serif">𝄞</text>${[48,58,68,78,88].map(v=>`<line x1="35" x2="${width-10}" y1="${v}" y2="${v}" stroke="#52616a"/>`).join('')}${notes.map((n,i)=>{if(n===null)return '';const x=52+i*44,yy=y(n),pc=n%12,acc=!natural.includes(pc);return `${yy>=98?`<line x1="${x-12}" x2="${x+12}" y1="98" y2="98" stroke="#17232c"/>`:''}${yy<=38?`<line x1="${x-12}" x2="${x+12}" y1="38" y2="38" stroke="#17232c"/>`:''}<ellipse cx="${x}" cy="${yy}" rx="6" ry="4.5" transform="rotate(-20 ${x} ${yy})" fill="#142531"/><line x1="${x+5}" x2="${x+5}" y1="${yy}" y2="${yy-27}" stroke="#142531" stroke-width="1.5"/>${acc?`<text x="${x-19}" y="${yy+5}" font-size="17">${pc===10?'♭':'♯'}</text>`:''}`}).join('')}</svg><small style="color:#45535c">G-nøkkel · C4 er midt-C · H = engelsk B, B = engelsk B♭</small></div>`}
function questionBody(){if(activity==='rhythm')return `<p class="question">Hvilken note mangler?</p><p class="muted">${q.bars} ${q.bars===1?'takt':'takter'} i ${q.meter}. ${q.level===4?'Hver 6/8-takt har seks åttendedeler, gruppert 3 + 3. En punktert firedel er ett hovedslag.':'En firedel er ett pulsslag.'}</p><div class="slots">${q.durations.map((d,i)=>`${q.level===4&&i>0&&q.durations.slice(0,i).reduce((a,b)=>a+b,0)===3?'<span aria-label="Taktstrek" style="border-left:2px solid var(--muted);margin:0 5px"></span>':''}<div class="slot ${i===q.index?'selected':''}" data-slot="${i}" aria-label="${i===q.index?'Manglende note':durationName(d)}"><span>${i===q.index?(answer?durationSymbol(answer):'?'):durationSymbol(d)}</span></div>`).join('')}</div><div class="choices">${q.choices.map(d=>`<button data-duration="${d}" aria-pressed="${answer===d}" ${solved||revealed?'disabled':''}><span class="symbol" aria-hidden="true">${durationSymbol(d)}</span>${durationName(d)}</button>`).join('')}</div>`;
if(activity==='melody')return `<p class="note">Først hører du tre akkorder (I–V–I) som gir deg følelsen av tonearten og grunntonen. Etter en kort pause kommer melodien. Fyll bare inn tonene i melodien, ikke innledningsakkordene.</p><p class="question">Bygg melodien du hørte</p><p class="muted">${q.notes.length} toner · ${shortNote(q.root)}-dur · Alle tonene er like lange. Dette er en melodiøvelse uten taktstreker.</p><div class="slots">${answer.map((n,i)=>`<button class="slot ${selected===i?'selected':''}" data-slot="${i}" data-select="${i}" ${solved||revealed?'disabled':''} aria-label="Tone ${i+1}: ${n===null?'ikke valgt':noteName(n)}"><small>${i+1}</small>${n===null?'?':noteName(n)}</button>`).join('')}</div><div class="choices">${q.pool.map(n=>`<button class="pitch-choice" data-note="${n}" ${solved||revealed?'disabled':''}>${noteName(n)}</button>`).join('')}</div><button data-play="answer">▶ Hør svaret mitt</button><details><summary>Se svaret mitt som noter</summary>${staff(answer)}</details>`;
return `<p class="question">${q.level<=2?'Hvilken avslutning går fra V til I?':'Hvilken akkordfunksjon hører du?'}</p><p class="muted">${shortNote(q.root)}-dur · ${q.level<=2?'I er tonika: det tonale hjemmet i denne øvelsen.':'Hør tonearten før du sammenligner akkordene.'}</p><div class="choices">${q.options.map((c,i)=>`<div style="flex:1;min-width:110px"><button data-chord="${c.label}" style="width:100%" aria-pressed="${answer===c.label}" ${solved||revealed?'disabled':''}><strong>${c.label}</strong><br><small>${c.meaning}</small></button><button data-audition="${i}" style="width:100%;margin-top:8px" aria-label="Hør ${c.label}">▶ Hør</button></div>`).join('')}</div><p class="note">Dette er funksjoner i vestlig durtonalitet. Andre musikalske tradisjoner kan organisere tonene annerledes.</p>`}
function renderActivity(){nvRemember();nvUpdate();const d=defs[activity];$('app').innerHTML=`<button class="quiet" data-go="home">← Alle aktiviteter</button><div class="activity-head"><div><div class="eyebrow" style="color:${d.color}">${d.skill}</div><h2>${d.name}</h2><p>${intro()}</p></div><span class="badge">${data.stats[activity].done} utforsket</span></div>${levelButtons()}<div class="layout"><section class="stage"><div class="progress-label"><span>${bands[q.level-1]}</span><span>Øv i ditt tempo</span></div><div class="transport"><button class="primary" data-play="target">▶ ${activity==='harmony'?'Hør toneart og oppgave':'Hør oppgaven'}</button><button data-play="slow">▷ Hør langsommere</button><button data-stop>■ Stopp</button></div>${questionBody()}<div id="feedback" role="status" aria-live="polite"></div><div class="bottom"><button class="primary" data-check ${solved||revealed?'disabled':''}>Sjekk svaret</button><button data-next>${solved||revealed?'Neste oppgave →':'Ny oppgave'}</button></div><div id="suggestion"></div></section><aside class="side"><h3>Du har verktøy</h3><p>Å lytte flere ganger er en del av øvingen. Bruk hjelp når du trenger det.</p><button data-hint>Gi meg et hint</button><button data-demo>Se et eksempel</button><button data-reveal>Vis og forklar svaret</button><p>Hint som røper deler av svaret blir ikke brukt til å vurdere nivået ditt.</p><details><summary>Hva øver jeg på?</summary><p>${({rhythm:'Å knytte noteverdier og hørte rytmer sammen. Å telle verdier er ikke det samme som å holde en jevn puls.',melody:'Å huske og finne tonehøyder i en melodi. Prøv å høre etter retningen mellom tonene.',harmony:'Å kjenne igjen akkordfunksjoner i en toneart. En akkord alene forteller ikke hvilken funksjon den har.'})[activity]}</p></details></aside></div>`}
function feedback(title,body,kind=''){const el=$('feedback');el.className='feedback '+kind;el.innerHTML='<strong>'+esc(title)+'</strong><p>'+esc(body)+'</p>'}
function recordObservation(correct){if(firstRecorded)return;firstRecorded=true;if(hinted)return;const key=activity+'-'+q.level,arr=data.observations[key]||[];arr.push(correct);data.observations[key]=arr;if(arr.length===10){const n=arr.filter(Boolean).length;data.observations[key]=[];if(n>=8&&q.level<4)suggestion={level:q.level+1,text:'Du fikk til '+n+' av 10 nye oppgaver uten svarhint. Vil du prøve neste nivå?'};else if(n<=4&&q.level>1)suggestion={level:q.level-1,text:'Vil du prøve et enklere steg eller fortsette her? Du bestemmer.'}}save()}
function showSuggestion(){if(suggestion&&scLevels(activity).includes(suggestion.level))$('suggestion').innerHTML=`<div class="feedback"><p>${esc(suggestion.text)}</p><div class="row" style="margin-top:10px"><button data-level="${suggestion.level}">Prøv nivå ${suggestion.level}</button><button data-dismiss>Fortsett her</button></div></div>`}
function check(){if(solved||revealed)return;if(answer===null||(Array.isArray(answer)&&answer.includes(null))){feedback('Velg et svar først.','Fyll ut alle rutene før du sjekker.');return}const correct=activity==='melody'?answer.every((n,i)=>n===q.notes[i]):answer===q.correct;recordObservation(correct);attempts++;if(correct){solved=true;data.stats[activity].done++;if(attempts===1&&!hinted)data.stats[activity].correct++;save();renderActivity();feedback('Det stemmer!',explanation(),'good');showSuggestion()}else{let tip=activity==='melody'?'Hør en gang til. Sammenlign melodien med svaret ditt.':activity==='rhythm'?'Sammenlign lengden på noten med plassen som mangler. Hør mønsteret en gang til.':'Denne akkorden finnes i tonearten, men svarer ikke på denne oppgaven. Sammenlign hele frasen.';feedback('Prøv en justering.',tip,'warn');showSuggestion()}}
function explanation(){if(activity==='rhythm')return 'Den manglende noten er en '+durationName(q.correct).toLowerCase()+'. '+(q.level===4?'De to 6/8-taktene har til sammen tolv åttendedeler.':'Noteverdiene i takten blir til sammen fire firedeler.');if(activity==='melody')return 'Melodien er '+q.notes.map(noteName).join(' – ')+'. Lytt til hele melodien igjen og legg merke til trinnene og sprangene.';return q.correct==='I'?(q.level<=2?'I er durakkorden på første trinn. Etter V fører den tilbake til tonika i denne frasen.':'I er durakkorden på første trinn: tonika i tonearten du hørte.'):'Dette er '+q.correct+': '+q.target.meaning+'. Sammenlign den med I etter at du har hørt tonearten.'}
function hint(){if(solved||revealed){feedback('Lytt og sammenlign.',explanation());return}hinted=true;if(activity==='melody'){const i=answer.findIndex((n,j)=>n!==q.notes[j]);selected=Math.max(0,i);answer[selected]=q.notes[selected];renderActivity();feedback('En tone er på plass.','Tone '+(selected+1)+' er '+noteName(q.notes[selected])+'. Hør igjen og finn de andre.')}else if(activity==='rhythm')feedback('Se på lengden.','Plassen som mangler er '+String(q.correct).replace('.',',')+' firedeler lang. En åttendedel er en halv firedel.');else feedback('Lytt etter funksjonen.',q.correct==='I'?'Målet er tonika, akkorden på første trinn. Sammenlign med den siste akkorden i innledningen.':'Målet er '+q.target.meaning+'. Prøv å sammenligne alternativene etter innledningen.')}
function reveal(){if(solved||revealed)return;hinted=true;revealed=true;answer=activity==='melody'?[...q.notes]:q.correct;renderActivity();feedback('Her er et løsningsforslag.',explanation()+' Denne oppgaven teller ikke som selvstendig løst.');}
function demo(){hinted=true;const body=activity==='rhythm'?'I 4/4 fyller en halvnote to slag. To firedeler fyller de to siste: 2 + 1 + 1 = 4. I 6/8 kan to punkterte firedeler fylle én takt.':activity==='melody'?'C4 – D4 – E4 går opp to ganger. C4 – E4 – D4 går først opp, så ned. Velg en rute før du setter inn tonen.':'I C-dur er I = C-dur, IV = F-dur og V = G-dur. Hør C–F–G–C: den siste akkorden kommer tilbake til tonika.';feedback('Eksempel',body);if(activity==='rhythm')sequence(rhythmEvents([2,1,1]));else if(activity==='melody')sequence([60,62,64].map(n=>({notes:n,dur:1})));else sequence([0,1,2,0].map(i=>chordEvent(48,chordDefs[i]))) }
function playTarget(slow=false){const bpm=slow?65:90;if(activity==='rhythm')sequence(rhythmEvents(q.durations),bpm,true);else if(activity==='melody'){const context=[0,2,0].map(i=>chordEvent(q.root-12,chordDefs[i],.65));sequence([...context,{notes:null,dur:.65},...q.notes.map((n,i)=>({notes:n,dur:1,slot:i}))],bpm,false)}else{const context=[0,1,2,0].map(i=>chordEvent(q.root,chordDefs[i],1.2));const tail=q.level<=2?[0,1,2].map(i=>chordEvent(q.root,chordDefs[i],1.5)):[chordEvent(q.root,q.target,2)];sequence([...context,{notes:null,dur:1},...tail],bpm)}}
function audition(i){const c=q.options[i];const events=q.level<=2?[0,1,2].map(j=>chordEvent(q.root,chordDefs[j],1.5)).concat([chordEvent(q.root,c,2)]):[0,1,2,0].map(j=>chordEvent(q.root,chordDefs[j],1)).concat([{notes:null,dur:.6},chordEvent(q.root,c,2)]);sequence(events)}
function createView(){return `<button class="quiet" data-go="home">← Alle aktiviteter</button><div class="activity-head"><div><div class="eyebrow">Skaperoppdrag</div><h2>Samme start. Ny slutt.</h2><p>To takter, fire firedeler i hver. Behold starten, og lag en ny slutt på den andre takten.</p></div><span class="badge">Ingen poeng · Ditt uttrykk</span></div><section class="stage"><h3>Oppdraget</h3><p class="muted">Første takt og de to første tonene i andre takt er låst. Endre minst én av de to siste tonene. Alle tonene er firedeler.</p><div class="creative-grid">${creative.map((n,i)=>`<label>Takt ${i<4?1:2} · slag ${i%4+1}<select data-create="${i}" ${i<6?'disabled':''} aria-label="Takt ${i<4?1:2}, slag ${i%4+1}">${[60,62,64,67,69].map(v=>`<option value="${v}" ${v===n?'selected':''}>${noteName(v)}</option>`).join('')}</select></label>`).join('')}</div>${staff(creative)}<div class="row"><button class="primary" data-play="creation">▶ Hør melodien</button><button data-play="original">▶ Sammenlign med originalen</button><button data-stop>■ Stopp</button><button data-save-creation>Lagre varianten</button></div><div id="creativeFeedback" role="status"></div><p class="note">Hva endret seg da du valgte en annen slutt? Hvilken versjon vil du beholde? Det finnes flere gode svar.</p></section>`}
function progressView(){const all=[...Object.values(data.stats),...Object.values(data.extraPractice).map(s=>({done:s.done,correct:s.first}))];return `<div class="eyebrow">Din egen reise</div><h2>Min øving</h2><p class="muted" style="margin-top:12px">Fremgangen ligger i denne nettleseren på denne enheten. Den er ikke sendt til en lærer.</p><div class="stats"><div class="stat"><strong>${all.reduce((a,s)=>a+s.done,0)}</strong>Oppgaver løst</div><div class="stat"><strong>${all.reduce((a,s)=>a+s.correct,0)}</strong>Riktig på første forsøk uten svarhint</div><div class="stat"><strong>${data.creations.length+thStore.creations.length}</strong>Lagrede melodivarianter</div></div><div class="cards">${Object.entries(defs).map(([k,d])=>`<div class="card"><h3>${d.name}</h3><p>Nivå ${scLevel(k,data.levels[k])} · ${data.stats[k].done} løst</p><button data-go="${k}">Fortsett →</button></div>`).join('')}</div><section class="stage" style="margin-top:24px"><h3>Mine melodivarianter</h3>${data.creations.length?data.creations.map((c,i)=>`<div class="saved"><span>${esc(c.title)}</span><div class="row"><button data-play-saved="${i}" aria-label="Spill ${esc(c.title)}">▶ Hør</button><button data-open-saved="${i}">Åpne</button></div></div>`).join(''):'<p class="muted" style="margin-top:12px">Lag din første variant i skaperverkstedet.</p>'}</section>${extraView()}${thProgressView()}<section class="strip"><div><h3>Ta vare på arbeidet</h3><p>Eksporter en kopi før du flytter appen, bytter nettleser eller sletter nettleserdata.</p></div><div class="row"><button data-export>Eksporter</button><button data-import>Importer</button></div></section><div id="importFeedback" role="status"></div>`}
function about(){return `<div class="eyebrow">For deg og de voksne</div><h2>Et lite rom for musikk.</h2><p class="muted" style="margin:20px 0">For 11–13-åringer med litt musikalsk erfaring. En frivillig utforsking av gehør, rytme og teori — i ditt tempo.</p><section class="stage"><details open><summary>Kom i gang</summary><p>Velg en aktivitet og trykk «Hør oppgaven». Velg svar eller bygg melodien, og trykk «Sjekk svaret». Bruk hint, eksempler og gjentatt lytting når du trenger det. I harmonioppgavene etablerer innledningen først tonearten; oppgaven kommer etter en kort pause.</p></details><details><summary>Hva betyr nivåene?</summary><p>Hver aktivitet har fire nivåer. Du velger selv og kan bytte når som helst. Etter ti sammenlignbare førstesvar uten svarhint kan appen foreslå et annet nivå. Dette er en enkel, foreløpig veiledning, ikke en test av musikaliteten din.</p></details><details><summary>Nettversjon og nedlasting</summary><p>Dette er nettversjonen av prototypen. Åpne nettadressen direkte i Safari eller en annen nettleser. Den private siden kan kreve innlogging med eierens ChatGPT-konto. Den har ikke elevkontoer. Offline-installasjon er ikke aktivert. En separat HTML-versjon finnes for nedlasting og lokal bruk på datamaskin.</p></details><details><summary>Lagring og personvern</summary><p>Appen bruker lokal nettleserlagring. Selve musikkappen lagrer ingen navn og bruker ingen mikrofon, annonser eller analyseverktøy. Tilgangen til den private nettsiden håndteres av vertstjenesten. Framgang kan forsvinne når nettleserdata slettes, i privat modus eller ved flytting av filen. Bruk eksport/import i «Min øving». En import erstatter den lokale framgangen; du får bekrefte dette først.</p></details><details><summary>Notenavn</summary><p>Vi bruker norske navn: H er engelsk B, og B er engelsk B♭. C4 er midt-C. Tallet viser oktaven. Melodioppgavene bruker G-nøkkel. Fortegn vises ved hver endret tone i denne prototypen, uten faste fortegn.</p></details><details><summary>Hva er kontrollert?</summary><p>Oppgavelogikken gjennomgås av en separat KI-agent i lærerrollen. Dette er ikke en godkjenning fra en menneskelig lærer. Prototypen må prøves på de faktiske enhetene og med elever før ordinær bruk. Appen erstatter ikke instrumentalundervisning eller samspill.</p></details><details><summary>Kilder og pedagogisk retning</summary><p>Planen bygger på internasjonale musikkfaglige rammeverk og forskning på digital og uformell musikklæring. Aktivitetene knytter lytting, forståelse og utprøving sammen. Harmonioppgavene gjelder vestlig durtonalitet; de representerer ikke alle musikalske systemer. Den separate læreplanen inneholder kildelisten.</p></details><button data-go="home" class="primary" style="margin-top:20px">Til aktivitetene →</button></section>`}
function render(){nvRemember();nvUpdate(); if(route==='groove'){$('app').innerHTML=grView();return} if(route==='notation'){$('app').innerHTML=nmView();return} if(route==='puzzle'){$('app').innerHTML=ppView();return} if(route==='theme'){$('app').innerHTML=themeView();return} $('app').innerHTML=route==='home'?home():route==='create'?createView():route==='progress'?progressView():about()}
function exportData(){const blob=new Blob([JSON.stringify({...data,themeEnding:thStore},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Musikkverkstad-framgang.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-test-audio')){testAudio();return}if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.level){if(!scLevels(activity).includes(Number(b.dataset.level)))return;data.levels[activity]=Number(b.dataset.level);save();newQuestion();return}if(b.hasAttribute('data-next')){newQuestion();return}if(b.hasAttribute('data-stop')){stopAudio();return}if(b.dataset.duration){answer=Number(b.dataset.duration);renderActivity();return}if(b.dataset.select){selected=Number(b.dataset.select);renderActivity();return}if(b.hasAttribute('data-select')){selected=0;renderActivity();return}if(b.dataset.note){answer[selected]=Number(b.dataset.note);const next=answer.findIndex((n,i)=>i>selected&&n===null);if(next>=0)selected=next;renderActivity();return}if(b.dataset.chord){answer=b.dataset.chord;renderActivity();return}if(b.hasAttribute('data-check')){check();return}if(b.hasAttribute('data-hint')){hint();return}if(b.hasAttribute('data-demo')){demo();return}if(b.hasAttribute('data-reveal')){reveal();return}if(b.hasAttribute('data-audition')){audition(Number(b.dataset.audition));return}if(b.hasAttribute('data-dismiss')){suggestion=null;$('suggestion').innerHTML='';return}if(b.dataset.play){const mode=b.dataset.play;if(mode==='target'||mode==='slow')playTarget(mode==='slow');else if(mode==='answer')sequence(answer.map((n,i)=>({notes:n,dur:1,slot:i})),90,true);else if(mode==='creation'||mode==='original')sequence((mode==='creation'?creative:[60,62,64,67,60,62,64,67]).map(n=>({notes:n,dur:1})));return}if(b.hasAttribute('data-save-creation')){const changed=creative[6]!==64||creative[7]!==67;if(!changed){$('creativeFeedback').className='feedback';$('creativeFeedback').textContent='Endre minst én av de to siste tonene for å lage en variasjon.';return}if(data.creations.length>=30){$('creativeFeedback').className='feedback';$('creativeFeedback').textContent='Du har 30 lagrede varianter. Eksporter en kopi; denne prototypen har plass til 30.';return}data.creations.push({title:'Melodivariant '+(data.creations.length+1),notes:[...creative]});save();$('creativeFeedback').className='feedback good';$('creativeFeedback').textContent=storageOK?'Varianten er lagret i «Min øving».':'Varianten er i denne økten. Eksporter fremgangen for å ta vare på den.';return}if(b.hasAttribute('data-play-saved')){sequence(data.creations[Number(b.dataset.playSaved)].notes.map(n=>({notes:n,dur:1})));return}if(b.hasAttribute('data-open-saved')){creative=[...data.creations[Number(b.dataset.openSaved)].notes];go('create');return}if(b.hasAttribute('data-export'))exportData();if(b.hasAttribute('data-import'))$('importFile').click()});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-create')){const i=Number(e.target.dataset.create);if(i>=6&&i<8)creative[i]=Number(e.target.value);stopAudio();render()}});
$('volume').value=data.volume*100;$('volume').addEventListener('input',e=>{data.volume=Number(e.target.value)/100;if(master)master.gain.value=data.volume*.22;save()});
$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>200000)throw Error('Filen er for stor.');const parsed=JSON.parse(await file.text());const legacyExtra=parsed.extraPractice===undefined;const imported=validData(parsed);const importedTheme=imported.themeEnding===undefined?null:thValid(imported.themeEnding);if(legacyExtra&&!confirm(extraText('legacy')))return;if(!confirm('Import erstatter fremgangen på denne enheten. Har du eksportert det du vil beholde?'))return;stopAudio();delete imported.themeEnding;data=imported;pp.level=data.extraPractice.puzzle.level;nm.level=data.extraPractice.notation.level;ppNew();nmNew();if(importedTheme){thStore=importedTheme;thCorrupt=false;thPersist()}save();$('volume').value=data.volume*100;if(master)master.gain.value=data.volume*.22;go('progress');$('importFeedback').className='feedback good';$('importFeedback').textContent=importedTheme&&!thSaveOK?thText('storage'):'Fremgangen er importert.'}catch(err){go('progress');$('importFeedback').className='feedback warn';$('importFeedback').textContent='Kunne ikke importere: '+err.message}finally{e.target.value=''}});

/* Backward-compatible progress extension; no pupil identifiers. */
function extraEmpty(){return {puzzle:{level:1,done:0,first:0,supported:0},notation:{level:1,done:0,first:0,supported:0}}}
function extraValid(v){
 if(v===undefined)return extraEmpty();

 }

 if(action==='context'){await thPlay([],thText('context'),false,true);return}
 if(action==='saved'){const c=thStore.creations[Number(value)];if(c)await thPlay(c.notes,thText('version')+' '+(Number(value)+1));return}
 if(action==='open-saved'){

 stopAudio();s.screen='explore';s.section='create';s.level=c.level;thNew();s.guess=c.notes.slice();go('theme');return;
 }
 if(action==='play'){

 if(notes.includes(null)){s.feedback=thText('incomplete');thDraw();return}
 const played=await thPlay(notes,({reference:thText('reference'),original:thText('original'),mine:thText('mine'),ending:thText('ending')})[value]||value,value==='ending');if(played&&thState===s&&s.question===q){s.heard[value]=true;thDraw()}return;
 }

 if(action==='hint'){s.hinted=true;s.feedback=thText('hintText')}

async function ppPlay(ids,label,mark=false){
 if(ids.includes(null)){pp.feedback=ppText('incomplete');ppDraw();return}
 // sequence stops previous playback synchronously; then mark loading as busy.
 const pending=sequence(ids.flatMap(id=>pp.pieces[id].map(n=>({notes:n,dur:1}))),90);
 const token=audioRun;pp.busy=true;pp.message=ppText('loading');ppDraw();
 const played=await pending;if(token!==audioRun||route!=='puzzle')return;
 if(!played){pp.busy=false;pp.message=ppText('error');ppDraw();return}
 pp.message=ppText('playing').replace('{name}',label);ppDraw();
 if(mark)ids.forEach((id,i)=>timers.push(setTimeout(()=>{if(token!==audioRun||route!=='puzzle')return;pp.playSlot=i;document.querySelectorAll('[data-pp-slot]').forEach(el=>el.classList.toggle('pp-live',Number(el.dataset.ppSlot)===i))},100+i*2*60000/90)));
 timers.push(setTimeout(()=>{if(token!==audioRun||route!=='puzzle')return;pp.busy=false;pp.playSlot=-1;pp.message=ppText('done');ppDraw()},150+ids.length*2*60000/90));
}

 if(action==='level'){const n=Number(value);if(!scLevels('puzzle').includes(n))return;stopAudio();pp.level=n;extraLevel('puzzle',n);ppNew()}
 if(action==='new'){stopAudio();ppNew()}
 if(action==='whole'){await ppPlay(pp.target,ppText('whole'),true);return}
 if(action==='preview'){const i=Number(value);if(Number.isInteger(i)&&pp.pieces[i])await ppPlay([i],ppText('fragment')+' '+String.fromCharCode(65+i));return}
 if(action==='mine'){await ppPlay(pp.answer,ppText('mine'),true);return}
 if(action==='slot'){const i=Number(value);if(Number.isInteger(i)&&i>=0&&i<pp.answer.length)pp.selected=i}
 if(action==='place'){const i=Number(value);if(!Number.isInteger(i)||!pp.pieces[i])return;pp.answer[pp.selected]=i;const next=pp.answer.findIndex((v,j)=>j>pp.selected&&v===null);if(next>=0)pp.selected=next;pp.feedback='';pp.success=false}
 if(action==='clear'){pp.answer[pp.selected]=null;pp.success=false;pp.feedback=''}
 if(action==='check'){if(pp.answer.includes(null))pp.feedback=ppText('incomplete');else{pp.checks++;const heard=pp.target.flatMap(i=>pp.pieces[i]),made=pp.answer.flatMap(i=>pp.pieces[i]);pp.success=heard.every((n,i)=>n===made[i]);if(pp.success)extraComplete('puzzle',pp);pp.feedback=ppText(pp.success?'right':'wrong')}}
 ppDraw();
}

function nmNew(){nm.level=scLevel('notation',nm.level);
 nm.recorded=false;nm.checks=0;nm.supportUsed=false;
 const pool=nm.level===1?[60,62,64]:nm.level===2?[60,62,64,67,69]:NM_SCALE;
 nm.target=[60,...Array.from({length:nm.level+1},()=>pick(pool))];
 if(nm.target.every(n=>n===60))nm.target[nm.target.length-1]=62;
 const count=nm.level===1?2:nm.level===4?4:3;
 const variants=[];
 // Finite candidate set: every single noninitial pitch substitution.
 for(let i=1;i<nm.target.length;i++)for(const pitch of pool)if(pitch!==nm.target[i]){const candidate=nm.target.slice();candidate[i]=pitch;variants.push(candidate)}
 nm.options=shuffle([nm.target.slice(),...shuffle(variants).slice(0,count-1)]);
 nm.correct=nm.options.findIndex(notes=>notes.every((n,i)=>n===nm.target[i]));
 nm.choice=null;nm.success=false;nm.feedback='';nm.message='';nm.support=false;
}

function grCard(){return `<section class="strip"><div><div class="eyebrow">${grText('week')}</div><h3>${grText('title')}</h3><p>${grText('desc')}</p></div><button class="primary" data-go="groove">${grText('title')} →</button></section>`}
function grButton(action,label,value='',extra=''){return `<button data-gr-action="${action}" data-gr-value="${value}" ${gr.busy&&action!=='stop'?'disabled':''} ${extra}>${label}</button>`}
function grDraw(){if(typeof nvRemember==='function'){nvRemember();nvUpdate()}if(route!=='groove')return;const app=$('app'),active=document.activeElement,action=app.contains?.(active)?active?.dataset?.grAction:null,value=active?.dataset?.grValue;app.innerHTML=grView();if(action){const buttons=Array.from(app.querySelectorAll?.('[data-gr-action]')||[]);const next=buttons.find(b=>!b.disabled&&b.dataset.grAction===action&&b.dataset.grValue===value)||buttons.find(b=>!b.disabled&&b.dataset.grAction==='stop');next?.focus({preventScroll:true})}}
function grStop(){gr.busy=false;gr.playSlot=-1;gr.message='';grDraw()}
function grView(){if(!gr.target.length)grNew();const s=grSpec(),width=4*s.division;
const grid=Array.from({length:s.bars},(_,bar)=>`<div class="gr-bar"><h3>${grText('bar')} ${bar+1}</h3><div class="gr-grid" style="--gr-columns:${s.division===2?4:4}">${Array.from({length:width},(_,j)=>{const i=bar*width+j,count=j%s.division===0?String(Math.floor(j/s.division)+1):'&',label=`${grText('bar')} ${bar+1}, ${grText('beat')} ${Math.floor(j/s.division)+1}${j%s.division?' &':''}`;return gr.mode==='listen'?`<span class="gr-cell ${gr.playSlot===i?'gr-current':''}" data-gr-cell="${i}">${count}</span>`:grButton('cell',`<small>${count}</small><strong>${gr.answer[i]?'●':'–'}</strong>`,i,`class="gr-cell ${gr.playSlot===i?'gr-current':''}" data-gr-cell="${i}" aria-label="${label}: ${grText(gr.answer[i]?'sound':'rest')}" aria-pressed="${!!gr.answer[i]}"`)}).join('')}</div></div>`).join('');
return `<section class="stage gr-stage"><button data-go="home">← ${grText('back')}</button><div class="eyebrow">${grText('week')}</div><h1>${grText('title')}</h1><div class="row gr-controls">${['listen','repair','create'].map(m=>grButton('mode',grText(m),m,`aria-pressed="${gr.mode===m}"`)).join('')}</div><div class="row gr-controls">${scLevels('groove').map(l=>grButton('level',`${grText('level')} ${l} · ${grText('l'+l)}`,l,`aria-pressed="${gr.level===l}"`)).join('')}</div><p>${grText(gr.mode+'Help')}</p><p class="note">${grText('guide')}</p><div class="row gr-controls">${gr.mode!=='create'?grButton('reference','▶ '+grText('reference')):''}${gr.mode!=='listen'?grButton('mine','▶ '+grText('mine')):''}${gr.mode==='create'?grButton('twice','▶ '+grText('twice')):''}${grButton('stop','■ '+grText('stop'))}</div><p role="status">${esc(gr.message||grText('ready'))}</p>${grid}${gr.mode==='listen'?`<div class="gr-options">${gr.options.map((_,i)=>`<div><h3>${'AB'[i]}</h3><div class="row gr-controls">${grButton('option','▶ '+grText('play')+' '+'AB'[i],i)}${grButton('choose',grText('choose')+' '+'AB'[i],i)}</div></div>`).join('')}</div>`:''}${gr.mode==='repair'?grButton('check',grText('check')):''}<p class="feedback ${gr.success?'good':''}" role="status">${esc(gr.feedback)}</p>${gr.mode==='create'?`<p class="note">${grText('reflect')}</p>`:''}<div class="row gr-controls">${grButton('new',grText('new'))}<button data-go="home">${grText('finish')}</button></div><p class="note">${grText('local')}</p></section>`}
async function grPlay(pattern,label,key='',repeat=1){if(!pattern.some(Boolean)){gr.feedback=grText('silent');grDraw();return}const step=1/grSpec().division,events=Array.from({length:repeat},()=>pattern).flat().map(v=>({notes:v?60:null,dur:step}));const pending=sequence(events,96);const token=audioRun;gr.busy=true;gr.message=grText('loading');grDraw();const played=await pending;if(token!==audioRun||route!=='groove')return;if(!played){gr.busy=false;gr.message=grText('error');grDraw();return}gr.message=grText('playing')+': '+label;grDraw();events.forEach((_,i)=>timers.push(setTimeout(()=>{if(token!==audioRun||route!=='groove')return;gr.playSlot=i%pattern.length;document.querySelectorAll('[data-gr-cell]').forEach(el=>el.classList.toggle('gr-current',Number(el.dataset.grCell)===gr.playSlot))},100+i*step*60000/96)));timers.push(setTimeout(()=>{if(token!==audioRun||route!=='groove')return;gr.busy=false;gr.playSlot=-1;gr.message=grText('done');if(key)gr.heard[key]=true;grDraw()},150+events.length*step*60000/96))}
async function grAction(action,value){if(action==='stop'){stopAudio();return}if(gr.busy)return;
if(action==='level'){const n=Number(value);if(!scLevels('groove').includes(n))return;stopAudio();gr.level=n;grNew()}
if(action==='mode'){if(!['listen','repair','create'].includes(value))return;stopAudio();gr.mode=value;grNew()}
if(action==='new'){stopAudio();grNew()}
if(action==='cell'&&gr.mode!=='listen'){const i=Number(value);if(Number.isInteger(i)&&i>=0&&i<gr.answer.length){gr.answer[i]=1-gr.answer[i];gr.feedback='';gr.success=false}}
if(action==='reference'){await grPlay(gr.target,grText('reference'),'reference');return}
if(action==='option'){const i=Number(value);if(i===0||i===1)await grPlay(gr.options[i],'AB'[i],'option'+i);return}
if(action==='mine'||action==='twice'){await grPlay(gr.answer,grText('mine'),'',action==='twice'?2:1);return}
if(action==='choose'){const i=Number(value);if(i!==0&&i!==1)return;if(!gr.heard.reference||!gr.heard.option0||!gr.heard.option1)gr.feedback=grText('hearFirst');else{gr.success=gr.options[i].every((v,j)=>v===gr.target[j]);gr.feedback=grText(gr.success?'right':'wrong')}}
if(action==='check'&&gr.mode==='repair'){gr.success=gr.answer.every((v,i)=>v===gr.target[i]);gr.feedback=grText(gr.success?'right':'wrong')}
grDraw()}
document.addEventListener('click',event=>{const b=event.target.closest('[data-gr-action]');if(!b||b.disabled)return;grAction(b.dataset.grAction,b.dataset.grValue).catch(()=>{gr.busy=false;gr.message=grText('error');grDraw()})});

/* Remember navigation only: never infer ability or retain unfinished answers. */
const NV_KEY='musikkverkstad-location-v1';
const nvWords={
 theme:['Tema','Tema','Theme'],previous:['Førre tema','Forrige tema','Previous theme'],next:['Neste tema','Neste tema','Next theme'],choose:['Vel tema','Velg tema','Choose theme'],
 start:['Start her','Start her','Start here'],resume:['Hald fram','Fortsett','Continue'],explore:['Utforsk temaa','Utforsk temaene','Explore themes'],
 fresh:['Hald fram opnar same aktivitet og nivå på nytt. Du kan alltid velje eit anna tema eller nivå.','Fortsett åpner samme aktivitet og nivå på nytt. Du kan alltid velge et annet tema eller nivå.','Continue opens the same activity and level again. You can always choose another theme or level.'],
 first:['Start med ei kort lytteoppgåve på nivå 1, eller vel eit tema sjølv.','Start med en kort lytteoppgave på nivå 1, eller velg et tema selv.','Start with a short level 1 listening task, or choose a theme yourself.'],
 storage:['Siste aktivitet kan ikkje lagrast her. Hald fram verkar berre i denne økta.','Siste aktivitet kan ikke lagres her. Fortsett virker bare i denne økten.','Your last activity cannot be saved here. Continue works only in this session.'],
 level:['nivå','nivå','level'],tools:['Verktøy og hjelp','Verktøy og hjelp','Tools and help']};
function nvText(k){return nvWords[k][document.documentElement.lang==='en'?2:document.documentElement.lang==='nb'?1:0]}
function nvValid(v){
 if(!v||typeof v!=='object'||Array.isArray(v)||Object.keys(v).some(k=>!['route','level','mode'].includes(k)))return null;
 if(!['theme','groove','rhythm','melody','harmony','puzzle','notation','create'].includes(v.route)||!Number.isInteger(v.level)||v.level<1||v.level>4)return null;
 const modes=v.route==='theme'?['listen','rebuild','create']:v.route==='groove'?['listen','repair','create']:null;
 if(modes?!modes.includes(v.mode):v.mode!==undefined)return null;
 if(v.route==='create'&&v.level!==1)return null;
 if(!scRouteAllowed(v.route))return null;
 return {route:v.route,level:scLevel(v.route,v.level),...(modes?{mode:v.mode}:{})};
}
let nvLast=null,nvSaveOK=true,nvSelected=0;
try{const raw=localStorage.getItem(NV_KEY);if(raw)nvLast=nvValid(JSON.parse(raw))}catch(e){nvSaveOK=false}
if(nvLast?.route==='groove')nvSelected=1;
function nvRemember(){let value;
 if(route==='theme')value={route,level:thState.level,mode:thState.section};
 else if(route==='groove')value={route,level:gr.level,mode:gr.mode};
 else if(['rhythm','melody','harmony'].includes(route))value={route,level:data.levels[route]};
 else if(route==='puzzle')value={route,level:pp.level};
 else if(route==='notation')value={route,level:nm.level};
 else if(route==='create')value={route,level:1};
 if(!value)return;
 const valid=nvValid(value);if(!valid)return;
 const changed=JSON.stringify(nvLast)!==JSON.stringify(valid);nvLast=valid;
 if(route==='theme'||route==='groove')nvSelected=route==='groove'?1:0;
 if(changed)try{localStorage.setItem(NV_KEY,JSON.stringify(nvLast));nvSaveOK=true}catch(e){nvSaveOK=false}
}
function nvTitle(i){return i===0?thText('title'):grText('title')}
let nvMarkup=null;
function nvUpdate(){if(!scThemeIndices().includes(nvSelected))nvSelected=scThemeIndices()[0];const host=$('themeNavigation');if(!host)return;const active=document.activeElement,focused=host.contains?.(active)?(active.id==='themeSelect'?'select':active.dataset?.nv):null;const markup=`<button data-nv="previous" aria-label="${nvText('previous')}" title="${nvText('previous')}" ${nvSelected===scThemeIndices()[0]?'disabled':''}>‹</button><label class="nv-select"><span aria-hidden="true">${nvText('theme')} 0${nvSelected+1} ▾</span><select id="themeSelect" aria-label="${nvText('choose')}">${scThemeIndices().map(i=>`<option value="${i}" ${i===nvSelected?'selected':''}>${nvText('theme')} 0${i+1} · ${nvTitle(i)}</option>`).join('')}</select></label><button data-nv="next" aria-label="${nvText('next')}" title="${nvText('next')}" ${nvSelected===scThemeIndices().at(-1)?'disabled':''}>›</button>`;if(nvMarkup===markup)return;host.innerHTML=markup;nvMarkup=markup;if(focused){const target=focused==='select'?$('themeSelect'):host.querySelector?.('[data-nv="'+focused+'"]');(target&&!target.disabled?target:$('themeSelect'))?.focus({preventScroll:true})}}
function nvHome(){return `<section class="nv-welcome"><div class="row"><button class="primary" data-nv="${nvLast?'continue':'start'}">${nvText(nvLast?'resume':'start')} →</button>${nvLast?`<button data-nv="start">${nvText('start')}</button>`:''}</div><p class="note">${nvText(nvLast?'fresh':'first').replace(/(nivå|level) 1/,'$1 '+scLevels(schoolSettings.themes[0])[0])}</p>${!nvSaveOK?`<p class="note" role="status">${nvText('storage')}</p>`:''}<details><summary>${nvText('explore')}</summary><div class="nv-theme-list">${scThemeIndices().map(i=>`<button data-nv="theme" data-nv-index="${i}">${nvText('theme')} 0${i+1} · ${nvTitle(i)}</button>`).join('')}</div></details></section>`}
function nvStart(){stopAudio();if(schoolSettings.themes[0]==='groove'){gr.level=scLevels('groove')[0];gr.mode='listen';grNew();go('groove');return}thState.screen='quick';thState.level=scLevels('theme')[0];thState.section='listen';thNew();go('theme')}
function nvContinue(){const v=nvValid(nvLast);if(!v){nvStart();return}stopAudio();
 if(v.route==='theme'){thState.screen='explore';thState.level=v.level;thState.section=v.mode;thNew()}
 else if(v.route==='groove'){gr.level=v.level;gr.mode=v.mode;grNew()}
 else if(v.route==='puzzle'){pp.level=v.level;ppNew()}
 else if(v.route==='notation'){nm.level=v.level;nmNew()}
 else if(['rhythm','melody','harmony'].includes(v.route))data.levels[v.route]=v.level;
 go(v.route);
}
function nvOpenTheme(i){if(!scThemeIndices().includes(i))return;nvSelected=i;go(i===0?'theme':'groove')}
function nvTheme(delta){const indices=scThemeIndices(),next=indices[indices.indexOf(nvSelected)+delta];if(next!==undefined)nvOpenTheme(next)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nv]');if(!b||b.disabled)return;const a=b.dataset.nv;if(a==='start')nvStart();if(a==='continue')nvContinue();if(a==='previous')nvTheme(-1);if(a==='next')nvTheme(1);if(a==='theme')nvOpenTheme(Number(b.dataset.nvIndex))});
document.addEventListener('change',e=>{if(e.target.id==='themeSelect')nvOpenTheme(Number(e.target.value))});
nvUpdate();

render();
</script>
</body></html>
