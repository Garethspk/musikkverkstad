async function ensureAudio(){
 let resumeTimer;
 try{
  if(data.volume===0){audioMessage('Lydstyrken i appen er 0. Skru opp med lydkontrollen øvst.');return false}
  // Request the media channel on supported iPhones, before creating/resuming audio.
  try{if(typeof navigator!=='undefined'&&navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}

   audioMessage('Startar lyd …');
   const resumed=ctx.resume();
   await Promise.race([resumed,new Promise((_,reject)=>{resumeTimer=setTimeout(()=>reject(Error('Audio start timed out')),4000)})]);
  }
  if(ctx.state!=='running')throw Error('Audio not running');
  $('audioStatus').classList.add('hidden');return true
 }catch(e){audioMessage('Lyd kunne ikkje startast. Trykk Test lyd igjen. Om det framleis er stille, opne sida direkte i Safari og sjekk lydstyrken og lydutgangen på telefonen.');return false}

}

let buffers=null,loading=null;
async function loadPiano(){
 if(buffers)return buffers;if(loading)return loading;
 loading=Promise.all(sampleMap.map(async([m,name])=>{
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{
 const response=await fetch('sounds/'+name+'.mp3',{signal:controller.signal});
 if(!response.ok)throw Error('sample unavailable');
 const bytes=await response.arrayBuffer();const buffer=await ctx.decodeAudioData(bytes);let peak=0;
 for(let c=0;c<buffer.numberOfChannels;c++){const channel=buffer.getChannelData(c);for(let i=0;i<channel.length;i++)peak=Math.max(peak,Math.abs(channel[i]))}
 if(!peak||buffer.duration<1)throw Error('invalid sample');return {m,buffer,peak};
 }finally{clearTimeout(timer)}
 })).then(items=>buffers=items).finally(()=>{loading=null});return loading;
}

 const sample=buffers.reduce((a,b)=>Math.abs(b.m-m)<Math.abs(a.m-m)?b:a),s=ctx.createBufferSource(),g=ctx.createGain();

}

function about(){return `<div class="eyebrow">For deg og dei vaksne</div><h2>Eit lite rom for musikk.</h2><p class="muted" style="margin:20px 0">For 11–13-åringar med litt musikalsk erfaring. Ei frivillig utforsking av gehør, rytme og teori — i ditt tempo.</p><section class="stage"><details open><summary>Kom i gang</summary><p>Vel ein aktivitet og trykk «Høyr oppgåva». Vel svar eller bygg melodien, og trykk «Sjekk svaret». Bruk hint, døme og gjenteken lytting når du treng det. I harmonioppgåvene spelar innleiinga først tonearten; oppgåva kjem etter ein kort pause.</p></details><details><summary>Kva tyder nivåa?</summary><p>Kvar aktivitet har fire nivå. Du vel sjølv og kan byte når som helst. Etter ti samanliknbare førstesvar utan svarhint kan appen føreslå eit anna nivå. Dette er ei enkel, førebels rettleiing, ikkje ein test av musikaliteten din.</p></details><details><summary>Nettversjon og nedlasting</summary><p>Dette er nettversjonen av prototypen. Opne nettadressa direkte i Safari eller ein annan nettlesar. Den private sida kan krevje innlogging med eigaren sin ChatGPT-konto. Ho har ikkje elevkontoar. Offline-installasjon er ikkje aktivert. Ein separat HTML-versjon finst for nedlasting og lokal bruk på datamaskin.</p></details><details><summary>Lagring og personvern</summary><p>Appen brukar lokal nettlesarlagring. Sjølve musikkappen lagrar ingen namn og brukar ingen mikrofon, annonser eller analyseverktøy. Tilgangen til den private nettsida blir handtert av vertstenesta. Framgang kan forsvinne når nettlesardata blir sletta, i privat modus eller ved flytting av fila. Bruk eksport/import i «Mi øving». Ein import erstattar den lokale framgangen; du får stadfeste dette først.</p></details><details><summary>Notenamn</summary><p>Me brukar norske namn: H er engelsk B, og B er engelsk B♭. C4 er midt-C. Talet viser oktaven. Melodioppgåvene brukar G-nøkkel. Forteikn blir viste ved kvar endra tone i denne prototypen, utan faste forteikn.</p></details><details><summary>Kva er kontrollert?</summary><p>Oppgåvelogikken blir gjennomgått av ein separat KI-agent i lærarrolla. Dette er ikkje ei godkjenning frå ein menneskeleg lærar. Prototypen må prøvast på dei faktiske einingane og med elevar før ordinær bruk. Appen erstattar ikkje instrumentalundervisning eller samspel.</p></details><details><summary>Kjelder og pedagogisk retning</summary><p>Planen byggjer på internasjonale musikkfaglege rammeverk og forsking på digital og uformell musikklæring. Aktivitetane knyter lytting, forståing og utprøving saman. Harmonioppgåvene gjeld vestleg durtonalitet; dei representerer ikkje alle musikalske system. Den separate læreplanen inneheld kjeldelista.</p></details><button data-go="home" class="primary" style="margin-top:20px">Til aktivitetane →</button></section>`}

/* Backward-compatible progress extension; no pupil identifiers. */
function extraEmpty(){return {puzzle:{level:1,done:0,first:0,supported:0},notation:{level:1,done:0,first:0,supported:0}}}
function extraValid(v){
 if(v===undefined)return extraEmpty();
 if(!v||typeof v!=='object'||Array.isArray(v)||Object.keys(v).some(k=>!['puzzle','notation'].includes(k)))throw Error('Invalid activity progress');
 for(const k of ['puzzle','notation']){const s=v[k];if(!s||typeof s!=='object'||Array.isArray(s)||Object.keys(s).some(x=>!['level','done','first','supported'].includes(x))||!Number.isInteger(s.level)||s.level<1||s.level>4)throw Error('Invalid activity level');
 for(const n of ['done','first','supported'])if(!Number.isInteger(s[n])||s[n]<0||s[n]>1000000)throw Error('Invalid activity count');
 if(s.first+s.supported>s.done)throw Error('Invalid activity totals');
 }return v;
}

 if(!scRouteAllowed('theme'))return;
 const s=thState,q=s.question,start=8-s.level;
 if(s.playing!==null&&['play','excerpt','demo','context','saved','answer','location','direction'].includes(action))return;

 if(action==='demo'){const notes=TH_BASE.slice();if(value==='changed')notes[7]=69;await thPlay(notes,thText('demo')+' '+(value==='changed'?'B':'A'));return}
 if(action==='context'){await thPlay([],thText('context'),false,true);return}
 if(action==='saved'){const c=thStore.creations[Number(value)];if(c)await thPlay(c.notes,thText('version')+' '+(Number(value)+1));return}
 if(action==='open-saved'){
 const c=thStore.creations[Number(value)];if(!c||!scLevels('theme').includes(c.level))return;
 stopAudio();s.screen='explore';s.section='create';s.level=c.level;thNew();s.guess=c.notes.slice();go('theme');return;
 }
 if(action==='play'){
 const notes=value==='reference'?q.target:value==='original'?TH_BASE:value==='mine'?s.guess:value==='ending'?q.target.slice(start):q[value];if(!Array.isArray(notes))return;
 if(notes.includes(null)){s.feedback=thText('incomplete');thDraw();return}
 const played=await thPlay(notes,({reference:thText('reference'),original:thText('original'),mine:thText('mine'),ending:thText('ending')})[value]||value,value==='ending');if(played&&thState===s&&s.question===q){s.heard[value]=true;thDraw()}return;
 }
 if(action==='slot'){const i=Number(value);if(Number.isInteger(i)&&i>=start&&i<8)s.selected=i}
 if(action==='note'){const n=Number(value);if(s.section==='listen'||!TH_POOL.includes(n))return;s.guess[s.selected]=n;s.feedback='';s.success=false;s.savedFinish=false;if(s.section==='rebuild'){const next=s.guess.findIndex((v,i)=>i>s.selected&&v===null);const first=s.guess.findIndex((v,i)=>i>=start&&v===null);if(next>=0)s.selected=next;else if(first>=0)s.selected=first}sequence([{notes:n,dur:1}],96)}
 if(action==='hint'){s.hinted=true;s.feedback=thText('hintText')}
 if(action==='answer'&&s.section==='listen'){
 if(s.success||s.matched||!['A','B'].includes(value))return;
 if(value!==q.odd){s.matched=true;if(s.level<3){s.success=true;s.feedback=value+' — '+thText('right');thDone()}else s.feedback=thText('locate').replace('{name}',q.odd)}else s.feedback=thText('wrong');
 }
 if(action==='location'&&s.section==='listen'&&s.matched&&!s.success&&!s.located){
 if(Number(value)===q.index){s.located=true;if(s.level===3){s.success=true;s.feedback=thText('right');thDone()}else s.feedback=thText('direction')}else s.feedback=thText('compareCue');
 }
 if(action==='direction'&&s.section==='listen'&&s.matched&&s.located&&!s.success&&s.level===4){
 if(value===q.direction){s.success=true;s.feedback=thText('right');thDone()}else s.feedback=thText('directionCue');
 }
 if(action==='check'&&s.section==='rebuild'){
 if(s.guess.includes(null))s.feedback=thText('incomplete');else if(s.guess.every((n,i)=>n===q.target[i])){s.success=true;s.feedback=thText('rebuiltCount').replace('{n}',s.level);thDone()}else s.feedback=thText('retry');
 }
 if(action==='save'&&s.section==='create'){
 s.savedFinish=false;
 if(s.guess.every((n,i)=>n===TH_BASE[i]))s.feedback=thText('changeFirst');else if(thStore.creations.some(c=>c.level===s.level&&c.notes.every((n,i)=>n===s.guess[i]))){if(!thSaveOK)thPersist();s.feedback=thSaveOK?thText('alreadySaved'):thText('storage')}else{thStore.creations.push({level:s.level,notes:s.guess.slice()});thStore.creations=thStore.creations.slice(-20);thDone();s.feedback=thSaveOK?thText('saved'):thText('storage')}

 }
 thDraw();
}

 const pool=nm.level===1?[60,62,64]:nm.level===2?[60,62,64,67,69]:NM_SCALE;
 nm.target=[60,...Array.from({length:nm.level+1},()=>pick(pool))];
 if(nm.target.every(n=>n===60))nm.target[nm.target.length-1]=62;
 const count=nm.level===1?2:nm.level===4?4:3;
 const variants=[];
 // Finite candidate set: every single noninitial pitch substitution.
 for(let i=1;i<nm.target.length;i++)for(const pitch of pool)if(pitch!==nm.target[i]){const candidate=nm.target.slice();candidate[i]=pitch;variants.push(candidate)}
 nm.options=shuffle([nm.target.slice(),...shuffle(variants).slice(0,count-1)]);
 nm.correct=nm.options.findIndex(notes=>notes.every((n,i)=>n===nm.target[i]));
 nm.choice=null;nm.success=false;nm.feedback='';nm.message='';nm.support=false;
}
function nmY(m){return 98-NM_SCALE.indexOf(m)*5}
function nmScore(notes,label){
 const width=notes.length*48+62;
 const body=notes.map((m,i)=>{const x=62+i*48,y=nmY(m),up=m<71;return `${m===60?`<line x1="${x-11}" x2="${x+11}" y1="98" y2="98" stroke="#142531"/>`:''}<ellipse cx="${x}" cy="${y}" rx="6" ry="4.5" transform="rotate(-20 ${x} ${y})" fill="#142531"/><line x1="${x+(up?5:-5)}" x2="${x+(up?5:-5)}" y1="${y}" y2="${y+(up?-30:30)}" stroke="#142531" stroke-width="1.5"/>`}).join('');
 return `<div class="staff"><svg viewBox="0 0 ${width} 130" role="img" aria-label="${nmText('score')} ${label}: ${nm.support?notes.map(noteName).join(', '):nmText('clef')}"><title>${nmText('score')} ${label} · ${nmText('clef')}</title><text x="7" y="83" font-size="51" font-family="serif">𝄞</text>${[48,58,68,78,88].map(y=>`<line x1="35" x2="${width-10}" y1="${y}" y2="${y}" stroke="#52616a"/>`).join('')}${body}</svg></div>`;
}

async function nmPlay(slow){const pending=sequence(nm.target.map(n=>({notes:n,dur:1})),slow?65:90);const token=audioRun;nm.busy=true;nm.message=nmText('loading');nmDraw();const played=await pending;if(token!==audioRun||route!=='notation')return;if(!played){nm.busy=false;nm.message=nmText('error');nmDraw();return}nm.message=nmText('playing');nmDraw();timers.push(setTimeout(()=>{if(token!==audioRun||route!=='notation')return;nm.busy=false;nm.message=nmText('done');nmDraw()},150+nm.target.length*60000/(slow?65:90)))}
async function nmAction(action,value){if(action==='stop'){stopAudio();return}if(nm.busy)return;
 if(action==='level'){const n=Number(value);if(!scLevels('notation').includes(n))return;stopAudio();nm.level=n;extraLevel('notation',n);nmNew()}
 if(action==='new'){stopAudio();nmNew()}
 if(action==='support'){nm.support=!nm.support;if(nm.support)nm.supportUsed=true}
 if(action==='play'||action==='slow'){await nmPlay(action==='slow');return}
 if(action==='answer'&&!nm.success){const i=Number(value);if(!Number.isInteger(i)||!nm.options[i])return;nm.choice=i;nm.feedback=''}
 if(action==='check'&&!nm.success){if(nm.choice===null)nm.feedback=nmText('selectFirst');else{nm.checks++;nm.success=nm.choice===nm.correct;if(nm.success)extraComplete('notation',nm);nm.feedback=nmText(nm.success?'right':'wrong')}}

 nmDraw();
}

function grValid(value){
 if(value===undefined)return grEmpty();
 const obj=v=>v&&typeof v==='object'&&!Array.isArray(v);
 if(!obj(value)||Object.keys(value).sort().join(',')!=='creations,done,level,version'||value.version!==1||!Number.isInteger(value.level)||value.level<1||value.level>4||!obj(value.done)||!Array.isArray(value.creations)||value.creations.length>20)throw Error('Invalid Theme 02 data');

function foLocale(){return document.documentElement.lang==='en'?2:document.documentElement.lang==='nb'?1:0}
function foText(k){return foWords[k][foLocale()]}
function foName(id){return id.endsWith('v')?id[0]+' '+foText('var'):id}
function foLabel(id){return id.endsWith('v')?id[0]+'′':id}
function foEvents(id){if(!Object.hasOwn(foMaterial,id))throw Error('Unknown section');return foMaterial[id].map(notes=>({notes,dur:1}))}
function foPitchY(midi){return 76-(midi-60)*6}
function foBriefs(level){if(!Number.isInteger(level)||level<1||level>4)throw Error('Invalid form level');return level===1?['repeat','contrast']:level===2?['return']:level===3?['variation']:['repeat','contrast','return','variation']}
function foShortMaps(){return {repeat:'A–A → B–B',contrast:'A–B → B–A',return:'A–B–A → B–A–B',variation:'A–A′ → B–B′'}[fo.brief]}
function foLength(brief){return brief==='return'?3:2}
function foMapValid(map,min=2,max=6){return Array.isArray(map)&&map.length>=min&&map.length<=max&&map.every(id=>['A','Av','B','Bv'].includes(id))}
function foFits(map,brief){
 if(!foMapValid(map)||map.length!==foLength(brief))return false;
 if(brief==='variation')return (map[0]==='A'&&map[1]==='Av')||(map[0]==='B'&&map[1]==='Bv');
 if(map.some(id=>!['A','B'].includes(id)))return false;
 if(brief==='repeat')return map[0]===map[1];
 if(brief==='contrast')return map[0]!==map[1];
 return brief==='return'&&map[0]===map[2]&&map[0]!==map[1];
}
function foOptions(brief,round=0){const bank={repeat:[['A','A'],['A','B'],['B','B']],contrast:[['A','B'],['B','A'],['A','A']],return:[['A','B','A'],['B','A','B'],['A','A','A']],variation:[['A','Av'],['B','Bv'],['A','B']]};if(!Object.hasOwn(bank,brief))throw Error('Invalid form brief');const options=bank[brief].map(m=>m.slice());return options.map((_,i)=>options[(i+round%3)%3])}
function foEmpty(){return {version:1,level:1,done:{},creations:[]}}
function foValid(v){
 if(v===undefined)return foEmpty();const object=x=>x&&typeof x==='object'&&!Array.isArray(x);
 if(!object(v)||Object.keys(v).sort().join(',')!=='creations,done,level,version'||v.version!==1||!Number.isInteger(v.level)||v.level<1||v.level>4||!object(v.done)||!Array.isArray(v.creations)||v.creations.length>20)throw Error('Invalid form data');
 for(const [key,n]of Object.entries(v.done))if(!/^(puzzle|build)-[1-4]$/.test(key)||!Number.isInteger(n)||n<1||n>1000000)throw Error('Invalid form count');
 for(const c of v.creations)if(!object(c)||Object.keys(c).sort().join(',')!=='level,map,previous'||!Number.isInteger(c.level)||c.level<1||c.level>4||!foMapValid(c.map)||(c.previous!==null&&!foMapValid(c.previous)))throw Error('Invalid saved form');
 return JSON.parse(JSON.stringify(v));
}

function foAction(action,value){
 if(!scRouteAllowed('form'))return;
 if(action==='level'){const level=Number(value);if(!scLevels('form').includes(level))return;stopAudio();fo.level=level;data.formPractice.level=level;save();foNew()}
 if(action==='mode'){if(!['puzzle','build','create'].includes(value))return;stopAudio();fo.mode=value;fo.selected=Math.min(fo.selected,foCurrent().length-1);fo.feedback='';fo.notice=''}
 if(action==='brief'){if(!foBriefs(fo.level).includes(value))return;fo.brief=value;foNew()}
 if(action==='new'){fo.round++;foNew()}
 if(action==='hint')fo.hint=true;
 if(action==='select'&&fo.mode==='puzzle'&&['0','1','2'].includes(String(value))){const i=Number(value);fo.selectedMaps=fo.selectedMaps.includes(i)?fo.selectedMaps.filter(n=>n!==i):[...fo.selectedMaps,i];fo.feedback=''}
 if(action==='slot'&&fo.mode!=='puzzle'){const i=Number(value);if(Number.isInteger(i)&&i>=0&&i<foCurrent().length)fo.selected=i}
 if(['place','left','right','clear','add','remove'].includes(action)&&fo.mode!=='puzzle'){
  const map=foCurrent().slice(),i=fo.selected,palette=fo.mode==='create'||fo.brief==='variation'?foPalette:['A','B'];let edited=false;
  if(action==='place'&&palette.includes(value)){foRememberEdit();map[i]=value;edited=true}
  if(action==='clear'&&fo.mode==='build'){foRememberEdit();map[i]=null;edited=true}
  if(action==='left'&&i>0){foRememberEdit();[map[i-1],map[i]]=[map[i],map[i-1]];fo.selected--;edited=true}
  if(action==='right'&&i<map.length-1){foRememberEdit();[map[i+1],map[i]]=[map[i],map[i+1]];fo.selected++;edited=true}
  if(action==='add'&&fo.mode==='create'&&map.length<6){foRememberEdit();map.push('A');edited=true}
  if(action==='remove'&&fo.mode==='create'&&map.length>2){foRememberEdit();map.splice(i,1);edited=true}
  if(edited){foSet(map);fo.feedback='';fo.notice=foSummary(map)}
 }
 if(action==='undo'&&fo.mode!=='puzzle'){const stack=fo.mode==='create'?fo.undoCreate:fo.undoBuild,last=stack.pop();if(last){foSet(last.map);fo.selected=last.selected;fo.feedback='';fo.notice=foSummary(last.map)}}
 if(action==='check'&&fo.mode==='puzzle'){const expected=fo.options.flatMap((m,i)=>foFits(m,fo.brief)?[i]:[]),ok=expected.length===fo.selectedMaps.length&&expected.every(i=>fo.selectedMaps.includes(i));fo.feedback=ok?foText('rightAnswer'):foText('wrong')+' '+foText(fo.brief+'Hint');if(ok)foComplete()}
 if(action==='check'&&fo.mode==='build'){if(fo.answer.includes(null))fo.feedback=foText('incomplete');else if(foFits(fo.answer,fo.brief)){fo.feedback=foText('rightAnswer');foComplete()}else fo.feedback=foText(fo.brief+'Hint')+' '+foText('wrong')}
 if(action==='snapshot'&&fo.mode==='create'){const replaced=!!fo.previous;fo.previous=fo.creation.slice();fo.feedback=foText(replaced?'replaced':'kept')}
 if(action==='save'&&fo.mode==='create'){
  const c={level:fo.level,map:fo.creation.slice(),previous:fo.previous?.slice()||null},s=data.formPractice;
  if(s.creations.some(x=>x.level===c.level&&x.map.join(',')===c.map.join(',')&&(x.previous===null?c.previous===null:c.previous!==null&&x.previous.join(',')===c.previous.join(','))))fo.feedback=foText('duplicate');
  else if(s.creations.length===20)fo.feedback=foText('limit');else{s.creations.push(c);save();fo.feedback=foText(storageOK?'saved':'storage')}
 }
 if(action==='open'){const c=data.formPractice.creations[Number(value)];if(!c||!scLevels('form').includes(c.level))return;stopAudio();fo.level=c.level;fo.mode='create';foNew();fo.creation=c.map.slice();fo.previous=c.previous?.slice()||null;fo.undoCreate=[];data.formPractice.level=c.level;save();go('form');return}
 foDraw();
}

function wgPush(){wg.undo.push({index:wg.index,labels:[...wg.labels],pattern:[...wg.pattern],division:wg.division,previous:wg.previous?JSON.parse(JSON.stringify(wg.previous)):null});if(wg.undo.length>20)wg.undo.shift()}
function wgStop(){wg.busy=false;if(wg.message===wgText('loading')||wg.message===wgText('playing'))wg.message=wgText('ready');if(route==='programme')wgDraw()}
async function wgPlay(before=false){stopAudio();const c=before?wg.previous:wg.task==='create'?wg:null;if(before&&!c)return;const events=c?WGCore.events(c.pattern,c.division):wgItem().events;if(!events.some(e=>e.notes!==null)){wg.message=wgText('silent');wgDraw();return}const pending=sequence(events,90),token=audioRun;wg.busy=true;wg.message=wgText('loading');wgDraw();const ok=await pending;if(token!==audioRun||route!=='programme')return;wg.busy=!!ok;wg.message=wgText(ok?'playing':'error');wgDraw();if(ok)timers.push(setTimeout(()=>{if(token!==audioRun||route!=='programme')return;wg.busy=false;wg.message=wgText('ready');wgDraw()},150+4*60000/90));}
function wgNewModel(){const d=wg.division;const models=WGCore.pulse.filter(x=>x.division===d&&x.brief!==2);const m=models[wg.index%models.length];wg.pattern=WGCore.grid(m).map(x=>x==='note'?1:0);}
function wgAction(action,value){
 if(!['open','stop','play','before','task','level','brief','label','place','check','symbol','cell','snapshot','undo','next','save'].includes(action)||!scRouteAllowed('programme'))return;
 if(action==='open'){const c=data.programmePractice.creations[Number(value)];if(!c||!scLevels('programme').includes(c.level))return;stopAudio();wg.task='create';wg.level=c.level;wg.brief=c.brief;wg.pattern=[...c.pattern];wg.division=c.division;wg.previous=c.previous?JSON.parse(JSON.stringify(c.previous)):null;wg.undo=[];wgReset();go('programme');return;}
 if(!scLevels('programme').includes(wg.level))return;
 if(action==='stop'){stopAudio();return}if(action==='play'||action==='before'){wgPlay(action==='before');return}
 stopAudio();wg.message='';
 if(action==='task'){if(!['pulse','symbol','create'].includes(value))return;wg.task=value;wg.index=0;wg.undo=[];wgReset();}
 if(action==='level'){const l=Number(value);if(!scLevels('programme').includes(l))return;wg.level=l;data.programmePractice.level=l;save();wg.undo=[];wgReset();}
 if(action==='brief'){const b=Number(value);if(wg.level!==4||![1,2,3].includes(b))return;wg.brief=b;wg.undo=[];wgReset();}
 if(['task','level','brief'].includes(action)&&wg.task==='create'){const division=wgBrief()===3?2:1;if(division!==wg.division){wg.drafts[wg.division]=[...wg.pattern];wg.division=division;wg.pattern=wg.drafts[division]?[...wg.drafts[division]]:Array(4*division).fill(0);}}
 if(action==='label'&&[...new Set(WGCore.labels(wgItem()))].includes(value))wg.selected=value;
 if(action==='place'&&wg.task==='pulse'){const i=Number(value);if(!Number.isInteger(i)||i<0||i>=4*wgItem().division)return;wgPush();wg.labels[i]=wg.selected;}
 if(action==='check'&&wg.task==='pulse'||action==='symbol'&&wg.task==='symbol'){
  if(action==='symbol'){if(!WGCore.symbolDefs.some(x=>x.id===value))return;wg.choice=value;}
  const ok=wg.task==='pulse'?WGCore.fitsPulse(wgItem(),wg.labels):WGCore.fitsSymbol(wgItem(),wg.choice);wg.message=wgText(ok?'right':wg.task==='pulse'?'pulseRetry':'symbolRetry');if(ok&&!wg.recorded){const key='w1-'+wg.task+'-'+wg.level;data.programmePractice.done[key]=Math.min(1000000,(data.programmePractice.done[key]||0)+1);wg.recorded=true;save();}
 }
 if(action==='cell'&&wg.task==='create'){const i=Number(value);if(!Number.isInteger(i)||i<0||i>=wg.pattern.length)return;wgPush();wg.pattern[i]=1-wg.pattern[i];}
 if(action==='snapshot'&&wg.task==='create'){wgPush();wg.previous={division:wg.division,pattern:[...wg.pattern]};wg.message=wgText('kept');}
 if(action==='undo'&&wg.undo.length)Object.assign(wg,wg.undo.pop());
 if(action==='next'){if(wg.task==='create')wgPush();else wg.undo=[];wg.index++;wgReset();if(wg.task==='create')wgNewModel();}
 if(action==='save'&&wg.task==='create'){
  const c={slot:'w1-create',challenge:'rhythm-free.v1',revision:1,level:wg.level,brief:wgBrief(),division:wg.division,pattern:[...wg.pattern],previous:wg.previous?JSON.parse(JSON.stringify(wg.previous)):null},s=data.programmePractice;
  if(s.creations.length>=20)wg.message=wgText('limit');else{try{wgValid({...s,creations:[...s.creations,c]});s.creations.push(c);save();wg.message=wgText(storageOK?'savedOK':'ready');}catch{wg.message=wgText('duplicate');}}
 }
 wgDraw(action+'-'+value);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-wg]');if(!b||b.disabled)return;wgAction(b.dataset.wg,b.dataset.wgValue)});

function wgCard(){return scRouteAllowed('programme')?`<section class="strip"><div><h3>${wgText('title')}</h3><p>${wgText('intro')}</p></div><button data-go="programme">${wgText('open')} →</button></section>`:''}

function wgImportReset(){wg.level=scLevel('programme',data.programmePractice.level);wg.brief=1;wg.previous=null;wg.division=wg.level===3?2:1;wg.pattern=Array.from({length:4*wg.division},(_,i)=>i%wg.division===0?1:0);wg.drafts={};wg.undo=[];wg.index=0;wgReset()}

/* Remember navigation only: never infer ability or retain unfinished answers. */
const NV_KEY='musikkverkstad-location-v1';
const nvWords={
 theme:['Tema','Tema','Theme'],previous:['Førre tema','Forrige tema','Previous theme'],next:['Neste tema','Neste tema','Next theme'],choose:['Vel tema','Velg tema','Choose theme'],
 start:['Start her','Start her','Start here'],resume:['Hald fram','Fortsett','Continue'],explore:['Utforsk temaa','Utforsk temaene','Explore themes'],
 fresh:['Hald fram opnar same aktivitet og nivå på nytt. Du kan alltid velje eit anna tema eller nivå.','Fortsett åpner samme aktivitet og nivå på nytt. Du kan alltid velge et annet tema eller nivå.','Continue opens the same activity and level again. You can always choose another theme or level.'],
 first:['Start med ei kort lytteoppgåve på nivå 1, eller vel eit tema sjølv.','Start med en kort lytteoppgave på nivå 1, eller velg et tema selv.','Start with a short level 1 listening task, or choose a theme yourself.'],
 storage:['Siste aktivitet kan ikkje lagrast her. Hald fram verkar berre i denne økta.','Siste aktivitet kan ikke lagres her. Fortsett virker bare i denne økten.','Your last activity cannot be saved here. Continue works only in this session.'],
 level:['nivå','nivå','level'],tools:['Verktøy og hjelp','Verktøy og hjelp','Tools and help']};
function nvText(k){return nvWords[k][document.documentElement.lang==='en'?2:document.documentElement.lang==='nb'?1:0]}
function nvValid(v){
 if(!v||typeof v!=='object'||Array.isArray(v)||Object.keys(v).some(k=>!['route','level','mode'].includes(k)))return null;
 if(!['theme','groove','programme','form','rhythm','melody','harmony','puzzle','notation','create'].includes(v.route)||!Number.isInteger(v.level)||v.level<1||v.level>4)return null;
 const modes=v.route==='theme'?['listen','rebuild','create']:v.route==='groove'?['listen','repair','create']:v.route==='programme'?['pulse','symbol','create']:v.route==='form'?['puzzle','build','create']:null;
 if(modes?!modes.includes(v.mode):v.mode!==undefined)return null;
 if(v.route==='create'&&v.level!==1)return null;
 if(!scRouteAllowed(v.route))return null;
 return {route:v.route,level:scLevel(v.route,v.level),...(modes?{mode:v.mode}:{})};
}
let nvLast=null,nvSaveOK=true,nvSelected=0;
try{const raw=localStorage.getItem(NV_KEY);if(raw)nvLast=nvValid(JSON.parse(raw))}catch(e){nvSaveOK=false}
if(nvLast?.route==='groove')nvSelected=1;
function nvRemember(){let value;
 if(route==='theme')value={route,level:thState.level,mode:thState.section};
 else if(route==='groove')value={route,level:gr.level,mode:gr.mode};
 else if(route==='programme')value={route,level:wg.level,mode:wg.task};
 else if(route==='form')value={route,level:fo.level,mode:fo.mode};
 else if(['rhythm','melody','harmony'].includes(route))value={route,level:data.levels[route]};
 else if(route==='puzzle')value={route,level:pp.level};
 else if(route==='notation')value={route,level:nm.level};
 else if(route==='create')value={route,level:1};
 if(!value)return;
 const valid=nvValid(value);if(!valid)return;
 const changed=JSON.stringify(nvLast)!==JSON.stringify(valid);nvLast=valid;
 if(route==='theme'||route==='groove')nvSelected=route==='groove'?1:0;
 if(changed)try{localStorage.setItem(NV_KEY,JSON.stringify(nvLast));nvSaveOK=true}catch(e){nvSaveOK=false}
}
function nvTitle(i){return i===0?thText('title'):grText('title')}
let nvMarkup=null;
function nvUpdate(){if(!scThemeIndices().includes(nvSelected))nvSelected=scThemeIndices()[0];const host=$('themeNavigation');if(!host)return;const active=document.activeElement,focused=host.contains?.(active)?(active.id==='themeSelect'?'select':active.dataset?.nv):null;const markup=`<button data-nv="previous" aria-label="${nvText('previous')}" title="${nvText('previous')}" ${nvSelected===scThemeIndices()[0]?'disabled':''}>‹</button><label class="nv-select"><span aria-hidden="true">${nvText('theme')} 0${nvSelected+1} ▾</span><select id="themeSelect" aria-label="${nvText('choose')}">${scThemeIndices().map(i=>`<option value="${i}" ${i===nvSelected?'selected':''}>${nvText('theme')} 0${i+1} · ${nvTitle(i)}</option>`).join('')}</select></label><button data-nv="next" aria-label="${nvText('next')}" title="${nvText('next')}" ${nvSelected===scThemeIndices().at(-1)?'disabled':''}>›</button>`;if(nvMarkup===markup)return;host.innerHTML=markup;nvMarkup=markup;if(focused){const target=focused==='select'?$('themeSelect'):host.querySelector?.('[data-nv="'+focused+'"]');(target&&!target.disabled?target:$('themeSelect'))?.focus({preventScroll:true})}}
function nvHome(){return `<section class="nv-welcome"><div class="row"><button class="primary" data-nv="${nvLast?'continue':'start'}">${nvText(nvLast?'resume':'start')} →</button>${nvLast?`<button data-nv="start">${nvText('start')}</button>`:''}</div><p class="note">${nvText(nvLast?'fresh':'first').replace(/(nivå|level) 1/,'$1 '+scLevels(schoolSettings.themes[0])[0])}</p>${!nvSaveOK?`<p class="note" role="status">${nvText('storage')}</p>`:''}<details><summary>${nvText('explore')}</summary><div class="nv-theme-list">${scThemeIndices().map(i=>`<button data-nv="theme" data-nv-index="${i}">${nvText('theme')} 0${i+1} · ${nvTitle(i)}</button>`).join('')}</div></details></section>`}
function nvStart(){stopAudio();if(schoolSettings.themes[0]==='groove'){gr.level=scLevels('groove')[0];gr.mode='listen';grNew();go('groove');return}thState.screen='quick';thState.level=scLevels('theme')[0];thState.section='listen';thNew();go('theme')}
function nvContinue(){const v=nvValid(nvLast);if(!v){nvStart();return}stopAudio();
 if(v.route==='theme'){thState.screen='explore';thState.level=v.level;thState.section=v.mode;thNew()}
 else if(v.route==='groove'){gr.level=v.level;gr.mode=v.mode;grNew()}
 else if(v.route==='programme'){wg.level=v.level;wgAction('task',v.mode)}
 else if(v.route==='form'){fo.level=v.level;fo.mode=v.mode;foNew()}
 else if(v.route==='puzzle'){pp.level=v.level;ppNew()}
 else if(v.route==='notation'){nm.level=v.level;nmNew()}
 else if(['rhythm','melody','harmony'].includes(v.route))data.levels[v.route]=v.level;
 go(v.route);
}
function nvOpenTheme(i){if(!scThemeIndices().includes(i))return;nvSelected=i;go(i===0?'theme':'groove')}
function nvTheme(delta){const indices=scThemeIndices(),next=indices[indices.indexOf(nvSelected)+delta];if(next!==undefined)nvOpenTheme(next)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nv]');if(!b||b.disabled)return;const a=b.dataset.nv;if(a==='start')nvStart();if(a==='continue')nvContinue();if(a==='previous')nvTheme(-1);if(a==='next')nvTheme(1);if(a==='theme')nvOpenTheme(Number(b.dataset.nvIndex))});
document.addEventListener('change',e=>{if(e.target.id==='themeSelect')nvOpenTheme(Number(e.target.value))});
nvUpdate();

render();
</script>
</body></html>
