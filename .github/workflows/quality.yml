name: Development quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Development success is not a pupil-release approval. Nothing is deployed.
      - run: npm run quality:prototype
      - name: Verify committed generated files are current
        run: git diff --exit-code -- dist
      - name: Upload quality report and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-quality
          include-hidden-files: true
          path: |
            .quality/
            playwright-report/
            test-results/
