<!doctype html><html lang="nn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self' about:; connect-src 'none'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Musikkverkstad · Veke 1–7</title><style>
:root{color-scheme:dark}body{margin:0;background:#0d1823;color:#f4f8fb;font:16px/1.5 system-ui,Segoe UI,sans-serif}header{font-size:14px;position:sticky;top:0;z-index:10;padding:12px 18px;border-bottom:1px solid #496579;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#111f2b}label{display:flex;gap:8px;align-items:center}button,select{font:inherit;background:#203b4e;color:#f4f8fb;padding:10px;border:1px solid #7794a8;border-radius:10px;min-height:48px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d5ed73;outline-offset:2px}iframe{width:100%;border:0;display:block;min-height:750px}details{margin:8px 18px;font-size:14px;color:#c1d2dd}summary{min-height:44px;cursor:pointer}.brand{font-size:20px;margin-right:auto}#status{margin:8px 18px;min-height:1.5em}#warning{font-size:12px;margin:6px 18px;color:#c1d2dd}button:disabled{opacity:.4}@media(max-width:600px){header{padding:8px;gap:8px}.brand{width:100%}label{flex:1}select{max-width:100%}iframe{min-height:800px}}
</style></head><body><header><strong class="brand">♫ Musikkverkstad</strong><label><span id="weekLabel">Veke</span><select id="week"></select></label><label><span id="languageLabel">Språk</span><select id="language"><option value="nn">Nynorsk</option><option value="nb">Bokmål</option><option value="en">English</option></select></label><button id="full">Fullskjerm</button><button id="reset">Nullstill prøvinga</button></header><p id="warning">Privat utviklingsprototype · menneskeleg validering PENDING · elevpublisering BLOCKED</p><details><summary id="helpTitle">Om denne prøvinga</summary><p id="help"></p></details><p id="status" role="status" aria-live="polite"></p><div id="host"></div><script>
'use strict';
const BANK=/* SEVEN_SOURCES */,titles=/* WEEK_TITLES */;
const words={nn:{week:'Veke',language:'Språk',reset:'Nullstill prøvinga',full:'Fullskjerm',help:'Om denne prøvinga',description:'Alle sju vekene er opne i denne prøvinga. Oppgåvene i kvar veke blir låste opp i rekkjefølgje. Fullførte oppgåver varer berre i denne opne fana. Byter du veke, startar uferdige rundar og utkast på nytt. Ingenting blir lagra eller sendt; bruk ikkje elevnamn. Nullstill før neste testperson. Lærar-, lyd-, språk-, hjelpemiddel- og einingstestar er ikkje godkjende enno.',confirm:'Nullstille alle fullførte oppgåver i denne prøvinga?',completed:'Fullførte oppgåver',error:'Fullskjerm er ikkje tilgjengeleg her.',blocked:'Privat utviklingsprototype · menneskeleg validering PENDING · elevpublisering BLOCKED'},nb:{week:'Uke',language:'Språk',reset:'Nullstill utprøvingen',full:'Fullskjerm',help:'Om denne utprøvingen',description:'Alle sju ukene er åpne i denne utprøvingen. Oppgavene i hver uke låses opp i rekkefølge. Fullførte oppgaver varer bare i denne åpne fanen. Uferdige runder og utkast starter på nytt når du bytter uke. Ingenting lagres eller sendes; bruk ikke elevnavn. Nullstill før neste testperson. Lærer-, lyd-, språk-, hjelpemiddel- og enhetstester er ikke godkjent ennå.',confirm:'Nullstille alle fullførte oppgaver?',completed:'Fullførte oppgaver',error:'Fullskjerm er ikke tilgjengelig her.',blocked:'Privat utviklingsprototype · menneskelig validering PENDING · elevpublisering BLOCKED'},en:{week:'Week',language:'Language',reset:'Reset trial',full:'Fullscreen',help:'About this trial',description:'All seven weeks are open for this trial. Tasks within each week unlock in sequence. Completed tasks last only in this open tab. Changing week resets unfinished rounds and drafts. Nothing is saved or sent; do not enter pupil names. Reset before the next tester. Teacher, sound, translation, assistive-technology and physical-device validation remains pending.',confirm:'Reset all completed tasks in this trial?',completed:'Completed tasks',error:'Fullscreen is unavailable here.',blocked:'Private prototype · human validation PENDING · pupil release BLOCKED'}};
for(const [key,value]of Object.entries({nn:['Programmet er fullført!','Veke 7 er fullført.'],nb:['Programmet er fullført!','Uke 7 er fullført.'],en:['Programme complete!','Week 7 complete.']})){words[key].programmeDone=value[0];words[key].lastWeekDone=value[1]}
let locale='nn',week=1,frame=null,session='',pending=null,resetPending=false,state=Array.from({length:7},()=>[false,false,false]);
const $=id=>document.getElementById(id),text=()=>words[locale];
function labels(){document.documentElement.lang=locale;const w=text();$('weekLabel').textContent=w.week;$('languageLabel').textContent=w.language;$('reset').textContent=w.reset;$('full').textContent=w.full;$('helpTitle').textContent=w.help;$('help').textContent=w.description;$('warning').textContent=w.blocked;$('week').innerHTML=titles[locale].map((t,i)=>`<option value="${i+1}" ${week===i+1?'selected':''}>${w.week} ${i+1} · ${t}${state[i].every(Boolean)?' ✓':''}</option>`).join('');const total=state.flat().filter(Boolean).length;$('status').textContent=(total===21?w.programmeDone+' ':week===7&&state[6].every(Boolean)?w.lastWeekDone+' ':'')+w.completed+': '+total+'/21'}
function mount(){resetPending=false;session=Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');const source=new TextDecoder().decode(Uint8Array.from(atob(BANK[week-1]),c=>c.charCodeAt(0)));frame=document.createElement('iframe');frame.title=titles[locale][week-1];frame.dataset.week=String(week);frame.dataset.ready='false';frame.inert=true;for(const id of ['week','language','reset'])$(id).disabled=true;frame.setAttribute('sandbox','allow-scripts');const boot=JSON.stringify({week,locale,completed:state[week-1],session}).replaceAll('<','\\u003c');frame.srcdoc=source.replace('/* BOOT_CONFIG */',boot);$('host').replaceChildren(frame);labels();window.scrollTo(0,0)}
function changeWeek(n){if(!Number.isInteger(n)||n<1||n>7)return;frame.inert=true;pending=()=>{week=n;mount()};frame.contentWindow.postMessage({type:'stop',session},'*')}
addEventListener('message',event=>{if(event.source!==frame?.contentWindow||event.origin!=='null'||!event.data||event.data.session!==session)return;const v=event.data;if(v.type==='ready'){frame.dataset.ready='true';frame.inert=false;for(const id of ['week','language','reset'])$(id).disabled=false}if(v.type==='stopped'&&pending){const run=pending;pending=null;run()}if(v.type==='size'&&Number.isFinite(v.height)&&v.height>=0&&v.height<20000)frame.style.height=Math.ceil(v.height+12)+'px';if(v.type==='progress'&&!resetPending&&v.week===week&&Array.isArray(v.completed)&&v.completed.length===3&&v.completed.every(x=>typeof x==='boolean')&&(!v.completed[1]||v.completed[0])&&(!v.completed[2]||v.completed[1])){state[week-1]=v.completed.slice();labels()}if(v.type==='advance-week'&&!resetPending&&!pending&&frame.dataset.ready==='true'&&v.week===week&&state[week-1].every(Boolean)){if(week<7)changeWeek(week+1);else{labels();window.scrollTo(0,0)}}if(v.type==='top')window.scrollTo(0,0)});
$('week').onchange=e=>changeWeek(Number(e.target.value));$('language').onchange=e=>{locale=e.target.value;labels();frame.contentWindow.postMessage({type:'language',session,locale},'*')};$('reset').onclick=()=>{if(confirm(text().confirm)){resetPending=true;state=Array.from({length:7},()=>[false,false,false]);changeWeek(1)}};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('status').textContent=text().error}};document.addEventListener('visibilitychange',()=>{if(document.hidden)frame?.contentWindow.postMessage({type:'stop',session},'*')});mount();
</script></body></html>
