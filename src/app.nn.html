<script>
'use strict';
const VERSION=1, STORAGE='musikkverkstad-v1';
const $=id=>document.getElementById(id), clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

const rand=n=>Math.floor(Math.random()*n), pick=a=>a[rand(a.length)], shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=rand(i+1);[b[i],b[j]]=[b[j],b[i]]}return b};
const NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','B','H'];
const noteName=m=>NAMES[m%12]+(Math.floor(m/12)-1), shortNote=m=>NAMES[m%12];
const defs={rhythm:{name:'Rytmereparatøren',desc:'Høyr mønsteret. Finn delen som manglar.',color:'var(--green)',icon:'♩ ♫',skill:'Rytme og takt'},melody:{name:'Melodidetektiven',desc:'Fang melodien og bygg han opp att.',color:'var(--blue)',icon:'↗ ↘',skill:'Gehør og melodi'},harmony:{name:'Finn heim',desc:'Utforsk kva akkordane gjer i musikken.',color:'var(--pink)',icon:'Ⅰ · Ⅳ · Ⅴ',skill:'Toneart og harmoni'}};

function emptyData(){return {version:VERSION,extraPractice:extraEmpty(),groovePractice:grEmpty(),conversationPractice:cvEmpty(),levels:{rhythm:1,melody:1,harmony:1},stats:{rhythm:{done:0,correct:0},melody:{done:0,correct:0},harmony:{done:0,correct:0}},observations:{},creations:[],volume:.55}}
function validData(d){if(!d||d.version!==1||!d.levels||!d.stats||!d.observations||!Array.isArray(d.creations)||d.creations.length>30)throw Error('Ukjend filformat.');for(const k of Object.keys(defs)){if(!Number.isInteger(d.levels[k])||d.levels[k]<1||d.levels[k]>4)throw Error('Ugyldig nivå.');const s=d.stats[k];if(!s||!Number.isInteger(s.done)||!Number.isInteger(s.correct)||s.done<0||s.correct<0||s.correct>s.done||s.done>1000000)throw Error('Ugyldig framgang.')}for(const [k,v]of Object.entries(d.observations)){if(!/^(rhythm|melody|harmony)-[1-4]$/.test(k)||!Array.isArray(v)||v.length>10||v.some(x=>typeof x!=='boolean'))throw Error('Ugyldige øvingsdata.')}for(const c of d.creations){if(!c||!Array.isArray(c.notes)||c.notes.length!==8||c.notes.some(n=>![60,62,64,67,69].includes(n))||typeof c.title!=='string'||c.title.length>80)throw Error('Ugyldig melodi.')}if(d.creations.some(c=>c.notes.slice(0,6).some((n,i)=>n!==[60,62,64,67,60,62][i])))throw Error('Ugyldig start på melodivariant.');if(typeof d.volume!=='number'||!Number.isFinite(d.volume)||d.volume<0||d.volume>1)throw Error('Ugyldig lydstyrke.');d.extraPractice=extraValid(d.extraPractice);d.groovePractice=grValid(d.groovePractice);d.conversationPractice=cvValid(d.conversationPractice);return d}
let data=emptyData(), storageOK=true, storageCorrupt=false, storageRaw=null;
try{storageRaw=localStorage.getItem(STORAGE);if(storageRaw)data=validData(JSON.parse(storageRaw))}catch(e){storageOK=false;storageCorrupt=storageRaw!==null;$('storageAlert').textContent='Lagra framgang kunne ikkje lesast. Du kan øve, men bruk «Eksporter» for å ta vare på arbeidet.';$('storageAlert').classList.remove('hidden')}
function save(){if(storageCorrupt){storageOK=false;return}try{localStorage.setItem(STORAGE,JSON.stringify(data));storageOK=true;$('storageAlert').classList.add('hidden')}catch(e){storageOK=false;$('storageAlert').textContent='Nettlesaren tillèt ikkje lagring her. Eksporter framgangen før du lukkar appen.';$('storageAlert').classList.remove('hidden')}}

async function ensureAudio(){
 let resumeTimer;
 try{
  if(data.volume===0){audioMessage('Lydstyrken i appen er 0. Skru opp med lydkontrollen øvst.');return false}
  // Request the media channel on supported iPhones, before creating/resuming audio.
  try{if(typeof navigator!=='undefined'&&navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!ctx||ctx.state==='closed'){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.connect(ctx.destination)}
  master.gain.value=data.volume*.22;
  if(ctx.state!=='running'){
   audioMessage('Startar lyd …');
   const resumed=ctx.resume();
   await Promise.race([resumed,new Promise((_,reject)=>{resumeTimer=setTimeout(()=>reject(Error('Audio start timed out')),4000)})]);
  }
  if(ctx.state!=='running')throw Error('Audio not running');
  $('audioStatus').classList.add('hidden');return true
 }catch(e){audioMessage('Lyd kunne ikkje startast. Trykk Test lyd igjen. Om det framleis er stille, opne sida direkte i Safari og sjekk lydstyrken og lydutgangen på telefonen.');return false}
 finally{if(resumeTimer)clearTimeout(resumeTimer)}
}
async function testAudio(){
 const played=await sequence([60,64,67].map(n=>({notes:n,dur:.6})));
 if(played)audioMessage('Tre testtonar er sende til lydutgangen. Høyrer du ingenting? Sjekk medielydstyrken og om lyden går til Bluetooth-høgtalarar eller hovudtelefonar. Prøv sida direkte i Safari. På eldre iPhone-versjonar kan du òg måtte slå av stillemodus.');
}

const sampleMap=[[48,'C3'],[54,'Fs3'],[60,'C4'],[66,'Fs4'],[72,'C5']];
let buffers=null,loading=null;
async function loadPiano(){
 if(buffers)return buffers;if(loading)return loading;
 loading=Promise.all(sampleMap.map(async([m,name])=>{
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{
 const response=await fetch('sounds/'+name+'.mp3',{signal:controller.signal});
 if(!response.ok)throw Error('sample unavailable');
 const bytes=await response.arrayBuffer();const buffer=await ctx.decodeAudioData(bytes);let peak=0;
 for(let c=0;c<buffer.numberOfChannels;c++){const channel=buffer.getChannelData(c);for(let i=0;i<channel.length;i++)peak=Math.max(peak,Math.abs(channel[i]))}
 if(!peak||buffer.duration<1)throw Error('invalid sample');return {m,buffer,peak};
 }finally{clearTimeout(timer)}
 })).then(items=>buffers=items).finally(()=>{loading=null});return loading;
}
function pianoTone(m,start,duration){
 const sample=buffers.reduce((a,b)=>Math.abs(b.m-m)<Math.abs(a.m-m)?b:a),s=ctx.createBufferSource(),g=ctx.createGain();
 s.buffer=sample.buffer;s.playbackRate.value=Math.pow(2,(m-sample.m)/12);
 const level=.27/sample.peak;
 g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(level,start+.004);g.gain.setValueAtTime(level,start+Math.max(.01,duration-.06));g.gain.linearRampToValueAtTime(0,start+duration);
 s.connect(g);g.connect(master);s.start(start);s.stop(start+duration+.04);s.onended=()=>{s.disconnect();g.disconnect()};sources.push(s);
}
async function sequence(events,bpm=90,highlight=false){stopAudio();const token=audioRun;if(!await ensureAudio()||token!==audioRun)return;
if(events.some(e=>(Array.isArray(e.notes)?e.notes.some(n=>n!==null):e.notes!==null))){
 try{if(!buffers)audioMessage('Lastar pianolydar …');await loadPiano()}
 catch(e){if(token===audioRun)audioMessage('Pianolyden kunne ikkje lastast. Sjekk nettilkoplinga og trykk spel igjen.');return false}
 if(token!==audioRun)return false;
 $('audioStatus').classList.add('hidden');
}
const unit=60/bpm,start=ctx.currentTime+.1;let beat=0;for(const [i,e]of events.entries()){const ns=Array.isArray(e.notes)?e.notes:[e.notes];ns.forEach(n=>{if(n!==null)pianoTone(n,start+beat*unit,e.dur*unit*.86)});if(highlight){const index=e.slot??i;timers.push(setTimeout(()=>{if(token!==audioRun)return;document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));document.querySelector('[data-slot="'+index+'"]')?.classList.add('playing')},100+beat*unit*1000))}beat+=e.dur}timers.push(setTimeout(()=>{if(token===audioRun){document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));sources=[]}},150+beat*unit*1000));return true}
function rhythmEvents(durations){return durations.map(d=>({notes:60,dur:d}))}
function chord(root,quality){return [root-12,root,root+(quality==='minor'?3:4),root+7]}
const chordDefs=[{label:'I',degree:0,quality:'major',meaning:'tonika · heim'},{label:'IV',degree:5,quality:'major',meaning:'subdominant'},{label:'V',degree:7,quality:'major',meaning:'dominant'},{label:'vi',degree:9,quality:'minor',meaning:'sjette trinn'}];
function chordEvent(root,c,dur=2){return {notes:chord(root+c.degree,c.quality),dur}}
function generate(type,level){if(type==='rhythm'){const patterns=level===1?[[1,1,1,1],[1,.5,.5,1,1],[.5,.5,1,1,1]]:level===2?[[2,1,1],[1,1.5,.5,1],[.5,.5,2,1],[1,.5,.5,2]]:level===3?[[.5,1,.5,1,1],[1.5,.5,.5,.5,1],[.5,.5,1.5,.5,1]]:[[1.5,1.5,1.5,1.5],[1,.5,1.5,.5,1,1.5],[.5,.5,.5,1.5,1.5,1.5]];const ds=[...pick(patterns)],index=rand(ds.length);return {type,level,durations:ds,index,correct:ds[index],choices:shuffle(level===1?[.5,1,2]:[.5,1,1.5,2]),meter:level===4?'6/8':'4/4',bars:level===4?2:1}}

const root=level>=3?pick([48,50,53,55]):48;const options=chordDefs.slice(0,level===1?2:level===4?4:3);if(level===1)options[1]=chordDefs[2];const target=level<=2?0:rand(options.length);return {type,level,root,options:shuffle(options),correct:options[target].label,target:options[target]}}
function newQuestion(){stopAudio();q=generate(activity,scLevel(activity,data.levels[activity]));answer=activity==='melody'?Array(q.notes.length).fill(null):null;selected=0;attempts=0;hinted=false;firstRecorded=false;solved=false;revealed=false;suggestion=null;renderActivity()}
function go(where){if(!scRouteAllowed(where)){nvStart();return}stopAudio();route=where;suggestion=null;if(defs[where]){activity=where;newQuestion()}else{activity=null;render()}window.scrollTo(0,0)}
function home(){return `<section class="hero"><div><div class="eyebrow">Ditt eige musikklaboratorium</div><h1>Høyr noko nytt.<br>Finn ut kvifor.</h1><p>Vel ei musikalsk utfordring. Prøv deg fram og finn ditt nivå.</p></div><div class="sound-art" aria-hidden="true">${[45,85,145,200,120,165,70,105].map(h=>`<span style="--h:${h}px"></span>`).join('')}</div></section>${nvHome()}${ppCard()}${nmCard()}<div class="section-head"><h3>Vel ei utfordring</h3><span class="tag">Ingen fast rekkjefølgje</span></div><div class="cards">${Object.entries(defs).filter(([k])=>scRouteAllowed(k)).map(([k,d])=>`<article class="card" style="--accent:${d.color}"><div class="tag">${d.skill}</div><div class="card-icon" aria-hidden="true">${d.icon}</div><h3>${d.name}</h3><p>${d.desc}</p><small>Nivå ${scLevel(k,data.levels[k])} · ${data.stats[k].done} oppgåver utforska</small><button class="primary" data-go="${k}">Start →</button></article>`).join('')}</div>${scRouteAllowed('create')?`<section class="strip"><div><div class="eyebrow" style="margin:0">Skaparoppdrag</div><h3>Fri melodiverkstad</h3><p>Lag ein liten melodisk variasjon. Du bestemmer korleis han skal låte.</p></div><button data-go="create">Opne verkstaden →</button></section>`:''}<p class="note">Du kan høyre om att så ofte du vil. Start lågt med lydstyrken, og vel eit nivå som passar deg.</p>`}
function durationName(d){return ({'0.5':'Åttandedel','1':'Firedel','1.5':'Punktert firedel','2':'Halvnote'})[d]}
function durationSymbol(d){return ({'0.5':'♪','1':'♩','1.5':'♩·','2':'𝅗𝅥'})[d]}
function displayDuration(d){return durationName(d)+' · '+String(d).replace('.',',')+' firedelar'}
function levelButtons(){return `<div class="levelbar"><span class="muted">Nivå</span>${bands.map((b,i)=>scLevels(activity).includes(i+1)?`<button data-level="${i+1}" aria-pressed="${scLevel(activity,data.levels[activity])===i+1}">${i+1} · ${b}</button>`:``).join('')}<small>Du kan alltid byte.</small></div>`}
function intro(){return ({rhythm:'Lytt til heile rytmen. Vel noteverdien som manglar i mønsteret.',melody:'Lytt til melodien. Vel ei rute, og set inn tonen du høyrde.',harmony:q.level<=2?'Lytt til tonearten og prøv dei to eller tre avslutningane. Finn akkorden som fører frå V tilbake til I.':'Lytt til ein akkord i ein tydeleg toneart. Kva funksjon har han?'})[activity]}
function staff(notes){const natural=[0,2,4,5,7,9,11];const y=m=>{let oct=Math.floor(m/12)-1,pc=m%12,idx=pc===10?6:natural.reduce((a,n,i)=>n<=pc?i:a,0);return 88-((oct-4)*7+idx-2)*5};const width=Math.max(300,notes.length*48+45);return `<div class="staff" aria-label="Notebilete av svaret ditt"><svg viewBox="0 0 ${width} 125" role="img" aria-label="Svaret ditt på notelinjer, G-nøkkel"><text x="7" y="83" font-size="51" font-family="serif">𝄞</text>${[48,58,68,78,88].map(v=>`<line x1="35" x2="${width-10}" y1="${v}" y2="${v}" stroke="#52616a"/>`).join('')}${notes.map((n,i)=>{if(n===null)return '';const x=52+i*44,yy=y(n),pc=n%12,acc=!natural.includes(pc);return `${yy>=98?`<line x1="${x-12}" x2="${x+12}" y1="98" y2="98" stroke="#17232c"/>`:''}${yy<=38?`<line x1="${x-12}" x2="${x+12}" y1="38" y2="38" stroke="#17232c"/>`:''}<ellipse cx="${x}" cy="${yy}" rx="6" ry="4.5" transform="rotate(-20 ${x} ${yy})" fill="#142531"/><line x1="${x+5}" x2="${x+5}" y1="${yy}" y2="${yy-27}" stroke="#142531" stroke-width="1.5"/>${acc?`<text x="${x-19}" y="${yy+5}" font-size="17">${pc===10?'♭':'♯'}</text>`:''}`}).join('')}</svg><small style="color:#45535c">G-nøkkel · C4 er midt-C · H = engelsk B, B = engelsk B♭</small></div>`}
function questionBody(){if(activity==='rhythm')return `<p class="question">Kva note manglar?</p><p class="muted">${q.bars} ${q.bars===1?'takt':'takter'} i ${q.meter}. ${q.level===4?'Kvar 6/8-takt har seks åttandedelar, grupperte 3 + 3. Ei punktert firedel er eitt hovudslag.':'Ein firedel er eitt pulsslag.'}</p><div class="slots">${q.durations.map((d,i)=>`${q.level===4&&i>0&&q.durations.slice(0,i).reduce((a,b)=>a+b,0)===3?'<span aria-label="Taktstrek" style="border-left:2px solid var(--muted);margin:0 5px"></span>':''}<div class="slot ${i===q.index?'selected':''}" data-slot="${i}" aria-label="${i===q.index?'Manglande note':durationName(d)}"><span>${i===q.index?(answer?durationSymbol(answer):'?'):durationSymbol(d)}</span></div>`).join('')}</div><div class="choices">${q.choices.map(d=>`<button data-duration="${d}" aria-pressed="${answer===d}" ${solved||revealed?'disabled':''}><span class="symbol" aria-hidden="true">${durationSymbol(d)}</span>${durationName(d)}</button>`).join('')}</div>`;
if(activity==='melody')return `<p class="note">Først høyrer du tre akkordar (I–V–I) som gir deg kjensla av tonearten og heimtonen. Etter ein kort pause kjem melodien. Fyll berre inn tonane i melodien, ikkje innleiingsakkordane.</p><p class="question">Bygg melodien du høyrde</p><p class="muted">${q.notes.length} tonar · ${shortNote(q.root)}-dur · Alle tonane er like lange. Dette er ei melodiøving utan taktstrekar.</p><div class="slots">${answer.map((n,i)=>`<button class="slot ${selected===i?'selected':''}" data-slot="${i}" data-select="${i}" ${solved||revealed?'disabled':''} aria-label="Tone ${i+1}: ${n===null?'ikkje vald':noteName(n)}"><small>${i+1}</small>${n===null?'?':noteName(n)}</button>`).join('')}</div><div class="choices">${q.pool.map(n=>`<button class="pitch-choice" data-note="${n}" ${solved||revealed?'disabled':''}>${noteName(n)}</button>`).join('')}</div><button data-play="answer">▶ Høyr svaret mitt</button><details><summary>Sjå svaret mitt som notar</summary>${staff(answer)}</details>`;
return `<p class="question">${q.level<=2?'Kva avslutning går frå V til I?':'Kva akkordfunksjon høyrer du?'}</p><p class="muted">${shortNote(q.root)}-dur · ${q.level<=2?'I er tonika: den tonale heimen i denne øvinga.':'Høyr tonearten før du samanliknar akkordane.'}</p><div class="choices">${q.options.map((c,i)=>`<div style="flex:1;min-width:110px"><button data-chord="${c.label}" style="width:100%" aria-pressed="${answer===c.label}" ${solved||revealed?'disabled':''}><strong>${c.label}</strong><br><small>${c.meaning}</small></button><button data-audition="${i}" style="width:100%;margin-top:8px" aria-label="Høyr ${c.label}">▶ Høyr</button></div>`).join('')}</div><p class="note">Dette er funksjonar i vestleg durtonalitet. Andre musikalske tradisjonar kan organisere tonane annleis.</p>`}
function renderActivity(){nvRemember();nvUpdate();const d=defs[activity];$('app').innerHTML=`<button class="quiet" data-go="home">← Alle aktivitetar</button><div class="activity-head"><div><div class="eyebrow" style="color:${d.color}">${d.skill}</div><h2>${d.name}</h2><p>${intro()}</p></div><span class="badge">${data.stats[activity].done} utforska</span></div>${levelButtons()}<div class="layout"><section class="stage"><div class="progress-label"><span>${bands[q.level-1]}</span><span>Øv i ditt tempo</span></div><div class="transport"><button class="primary" data-play="target">▶ ${activity==='harmony'?'Høyr toneart og oppgåve':'Høyr oppgåva'}</button><button data-play="slow">▷ Høyr rolegare</button><button data-stop>■ Stopp</button></div>${questionBody()}<div id="feedback" role="status" aria-live="polite"></div><div class="bottom"><button class="primary" data-check ${solved||revealed?'disabled':''}>Sjekk svaret</button><button data-next>${solved||revealed?'Neste oppgåve →':'Ny oppgåve'}</button></div><div id="suggestion"></div></section><aside class="side"><h3>Du har verktøy</h3><p>Å lytte fleire gonger er ein del av øvinga. Bruk hjelp når du treng det.</p><button data-hint>Gje meg eit hint</button><button data-demo>Sjå eit døme</button><button data-reveal>Vis og forklar svaret</button><p>Hint som røper delar av svaret blir ikkje brukte til å vurdere nivået ditt.</p><details><summary>Kva øver eg på?</summary><p>${({rhythm:'Å knyte noteverdiar og høyrde rytmar saman. Å telje verdiar er ikkje det same som å halde ein jamn puls.',melody:'Å hugse og finne tonehøgder i ein melodi. Prøv å høyre etter retninga mellom tonane.',harmony:'Å kjenne att akkordfunksjonar i ein toneart. Ein akkord åleine fortel ikkje kva funksjon han har.'})[activity]}</p></details></aside></div>`}
function feedback(title,body,kind=''){const el=$('feedback');el.className='feedback '+kind;el.innerHTML='<strong>'+esc(title)+'</strong><p>'+esc(body)+'</p>'}
function recordObservation(correct){if(firstRecorded)return;firstRecorded=true;if(hinted)return;const key=activity+'-'+q.level,arr=data.observations[key]||[];arr.push(correct);data.observations[key]=arr;if(arr.length===10){const n=arr.filter(Boolean).length;data.observations[key]=[];if(n>=8&&q.level<4)suggestion={level:q.level+1,text:'Du fekk til '+n+' av 10 nye oppgåver utan svarhint. Vil du prøve neste nivå?'};else if(n<=4&&q.level>1)suggestion={level:q.level-1,text:'Vil du prøve eit rolegare steg eller halde fram her? Du bestemmer.'}}save()}
function showSuggestion(){if(suggestion&&scLevels(activity).includes(suggestion.level))$('suggestion').innerHTML=`<div class="feedback"><p>${esc(suggestion.text)}</p><div class="row" style="margin-top:10px"><button data-level="${suggestion.level}">Prøv nivå ${suggestion.level}</button><button data-dismiss>Hald fram her</button></div></div>`}
function check(){if(solved||revealed)return;if(answer===null||(Array.isArray(answer)&&answer.includes(null))){feedback('Vel eit svar først.','Fyll ut alle rutene før du sjekkar.');return}const correct=activity==='melody'?answer.every((n,i)=>n===q.notes[i]):answer===q.correct;recordObservation(correct);attempts++;if(correct){solved=true;data.stats[activity].done++;if(attempts===1&&!hinted)data.stats[activity].correct++;save();renderActivity();feedback('Det stemmer!',explanation(),'good');showSuggestion()}else{let tip=activity==='melody'?'Høyr ein gong til. Samanlikn melodien med svaret ditt.':activity==='rhythm'?'Samanlikn lengda på noten med plassen som manglar. Høyr mønsteret ein gong til.':'Denne akkorden finst i tonearten, men svarar ikkje på denne oppgåva. Samanlikn heile frasen.';feedback('Prøv ei justering.',tip,'warn');showSuggestion()}}
function explanation(){if(activity==='rhythm')return 'Den manglande noten er ein '+durationName(q.correct).toLowerCase()+'. '+(q.level===4?'Dei to 6/8-taktene har til saman tolv åttandedelar.':'Noteverdiane i takta blir til saman fire firedelar.');if(activity==='melody')return 'Melodien er '+q.notes.map(noteName).join(' – ')+'. Lytt til heile melodien igjen og legg merke til stega og spranga.';return q.correct==='I'?(q.level<=2?'I er durakkorden på første trinn. Etter V fører han tilbake til tonika i denne frasen.':'I er durakkorden på første trinn: tonika i tonearten du høyrde.'):'Dette er '+q.correct+': '+q.target.meaning+'. Samanlikn han med I etter at du har høyrt tonearten.'}
function hint(){if(solved||revealed){feedback('Lytt og samanlikn.',explanation());return}hinted=true;if(activity==='melody'){const i=answer.findIndex((n,j)=>n!==q.notes[j]);selected=Math.max(0,i);answer[selected]=q.notes[selected];renderActivity();feedback('Ein tone er på plass.','Tone '+(selected+1)+' er '+noteName(q.notes[selected])+'. Høyr igjen og finn dei andre.')}else if(activity==='rhythm')feedback('Sjå på lengda.','Plassen som manglar er '+String(q.correct).replace('.',',')+' firedelar lang. Ein åttandedel er ein halv firedel.');else feedback('Lytt etter funksjonen.',q.correct==='I'?'Målet er tonika, akkorden på første trinn. Samanlikn med den siste akkorden i innleiinga.':'Målet er '+q.target.meaning+'. Prøv å samanlikne kandidatane etter innleiinga.')}
function reveal(){if(solved||revealed)return;hinted=true;revealed=true;answer=activity==='melody'?[...q.notes]:q.correct;renderActivity();feedback('Her er eit løysingsforslag.',explanation()+' Denne oppgåva tel ikkje som sjølvstendig løyst.');}
function demo(){hinted=true;const body=activity==='rhythm'?'I 4/4 fyller ein halvnote to slag. To firedelar fyller dei to siste: 2 + 1 + 1 = 4. I 6/8 kan to punkterte firedelar fylle éi takt.':activity==='melody'?'C4 – D4 – E4 går opp to gonger. C4 – E4 – D4 går først opp, så ned. Vel ei rute før du set inn tonen.':'I C-dur er I = C-dur, IV = F-dur og V = G-dur. Høyr C–F–G–C: den siste akkorden kjem tilbake til tonika.';feedback('Døme',body);if(activity==='rhythm')sequence(rhythmEvents([2,1,1]));else if(activity==='melody')sequence([60,62,64].map(n=>({notes:n,dur:1})));else sequence([0,1,2,0].map(i=>chordEvent(48,chordDefs[i]))) }
function playTarget(slow=false){const bpm=slow?65:90;if(activity==='rhythm')sequence(rhythmEvents(q.durations),bpm,true);else if(activity==='melody'){const context=[0,2,0].map(i=>chordEvent(q.root-12,chordDefs[i],.65));sequence([...context,{notes:null,dur:.65},...q.notes.map((n,i)=>({notes:n,dur:1,slot:i}))],bpm,false)}else{const context=[0,1,2,0].map(i=>chordEvent(q.root,chordDefs[i],1.2));const tail=q.level<=2?[0,1,2].map(i=>chordEvent(q.root,chordDefs[i],1.5)):[chordEvent(q.root,q.target,2)];sequence([...context,{notes:null,dur:1},...tail],bpm)}}
function audition(i){const c=q.options[i];const events=q.level<=2?[0,1,2].map(j=>chordEvent(q.root,chordDefs[j],1.5)).concat([chordEvent(q.root,c,2)]):[0,1,2,0].map(j=>chordEvent(q.root,chordDefs[j],1)).concat([{notes:null,dur:.6},chordEvent(q.root,c,2)]);sequence(events)}
function createView(){return `<button class="quiet" data-go="home">← Alle aktivitetar</button><div class="activity-head"><div><div class="eyebrow">Skaparoppdrag</div><h2>Same start. Ny slutt.</h2><p>To takter, fire firedelar i kvar. Behald starten, og lag ein ny slutt på den andre takta.</p></div><span class="badge">Ingen poeng · Ditt uttrykk</span></div><section class="stage"><h3>Oppdraget</h3><p class="muted">Første takt og dei to første tonane i andre takt er låste. Endre minst éin av dei to siste tonane. Alle tonane er firedelar.</p><div class="creative-grid">${creative.map((n,i)=>`<label>Takt ${i<4?1:2} · slag ${i%4+1}<select data-create="${i}" ${i<6?'disabled':''} aria-label="Takt ${i<4?1:2}, slag ${i%4+1}">${[60,62,64,67,69].map(v=>`<option value="${v}" ${v===n?'selected':''}>${noteName(v)}</option>`).join('')}</select></label>`).join('')}</div>${staff(creative)}<div class="row"><button class="primary" data-play="creation">▶ Høyr melodien</button><button data-play="original">▶ Samanlikn med originalen</button><button data-stop>■ Stopp</button><button data-save-creation>Lagre varianten</button></div><div id="creativeFeedback" role="status"></div><p class="note">Kva endra seg då du valde ein annan slutt? Kva versjon vil du behalde? Det finst fleire gode svar.</p></section>`}
function progressView(){const all=[...Object.values(data.stats),...Object.values(data.extraPractice).map(s=>({done:s.done,correct:s.first}))];return `<div class="eyebrow">Di eiga reise</div><h2>Mi øving</h2><p class="muted" style="margin-top:12px">Framgangen ligg i denne nettlesaren på denne eininga. Han er ikkje sendt til ein lærar.</p><div class="stats"><div class="stat"><strong>${all.reduce((a,s)=>a+s.done,0)}</strong>Oppgåver løyste</div><div class="stat"><strong>${all.reduce((a,s)=>a+s.correct,0)}</strong>Rett på første forsøk utan svarhint</div><div class="stat"><strong>${data.creations.length+thStore.creations.length}</strong>Lagra melodivariantar</div></div><div class="cards">${Object.entries(defs).filter(([k])=>scRouteAllowed(k)).map(([k,d])=>`<div class="card"><h3>${d.name}</h3><p>Nivå ${scLevel(k,data.levels[k])} · ${data.stats[k].done} løyste</p><button data-go="${k}">Hald fram →</button></div>`).join('')}</div><section class="stage" style="margin-top:24px"><h3>Mine melodivariantar</h3>${data.creations.length?data.creations.map((c,i)=>`<div class="saved"><span>${esc(c.title)}</span><div class="row"><button data-play-saved="${i}" aria-label="Spel ${esc(c.title)}">▶ Høyr</button><button data-open-saved="${i}">Opne</button></div></div>`).join(''):'<p class="muted" style="margin-top:12px">Lag din første variant i skaparverkstaden.</p>'}</section>${extraView()}${thProgressView()}${grProgressView()}${cvProgressView()}<section class="strip"><div><h3>Ta vare på arbeidet</h3><p>Eksporter ein kopi før du flyttar appen, byter nettlesar eller slettar nettlesardata.</p></div><div class="row"><button data-export>Eksporter</button><button data-import>Importer</button></div></section><div id="importFeedback" role="status"></div>`}
function about(){return `<div class="eyebrow">For deg og dei vaksne</div><h2>Eit lite rom for musikk.</h2><p class="muted" style="margin:20px 0">For 11–13-åringar med litt musikalsk erfaring. Ei frivillig utforsking av gehør, rytme og teori — i ditt tempo.</p><section class="stage"><details open><summary>Kom i gang</summary><p>Vel ein aktivitet og trykk «Høyr oppgåva». Vel svar eller bygg melodien, og trykk «Sjekk svaret». Bruk hint, døme og gjenteken lytting når du treng det. I harmonioppgåvene spelar innleiinga først tonearten; oppgåva kjem etter ein kort pause.</p></details><details><summary>Kva tyder nivåa?</summary><p>Kvar aktivitet har fire nivå. Du vel sjølv og kan byte når som helst. Etter ti samanliknbare førstesvar utan svarhint kan appen føreslå eit anna nivå. Dette er ei enkel, førebels rettleiing, ikkje ein test av musikaliteten din.</p></details><details><summary>Nettversjon og nedlasting</summary><p>Dette er nettversjonen av prototypen. Opne nettadressa direkte i Safari eller ein annan nettlesar. Den private sida kan krevje innlogging med eigaren sin ChatGPT-konto. Ho har ikkje elevkontoar. Offline-installasjon er ikkje aktivert. Ein separat HTML-versjon finst for nedlasting og lokal bruk på datamaskin.</p></details><details><summary>Lagring og personvern</summary><p>Appen brukar lokal nettlesarlagring. Sjølve musikkappen lagrar ingen namn og brukar ingen mikrofon, annonser eller analyseverktøy. Tilgangen til den private nettsida blir handtert av vertstenesta. Framgang kan forsvinne når nettlesardata blir sletta, i privat modus eller ved flytting av fila. Bruk eksport/import i «Mi øving». Ein import erstattar den lokale framgangen; du får stadfeste dette først.</p></details><details><summary>Notenamn</summary><p>Me brukar norske namn: H er engelsk B, og B er engelsk B♭. C4 er midt-C. Talet viser oktaven. Melodioppgåvene brukar G-nøkkel. Forteikn blir viste ved kvar endra tone i denne prototypen, utan faste forteikn.</p></details><details><summary>Kva er kontrollert?</summary><p>Oppgåvelogikken blir gjennomgått av ein separat KI-agent i lærarrolla. Dette er ikkje ei godkjenning frå ein menneskeleg lærar. Prototypen må prøvast på dei faktiske einingane og med elevar før ordinær bruk. Appen erstattar ikkje instrumentalundervisning eller samspel.</p></details><details><summary>Kjelder og pedagogisk retning</summary><p>Planen byggjer på internasjonale musikkfaglege rammeverk og forsking på digital og uformell musikklæring. Aktivitetane knyter lytting, forståing og utprøving saman. Harmonioppgåvene gjeld vestleg durtonalitet; dei representerer ikkje alle musikalske system. Den separate læreplanen inneheld kjeldelista.</p></details><button data-go="home" class="primary" style="margin-top:20px">Til aktivitetane →</button></section>`}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-test-audio')){testAudio();return}if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.level){if(!scLevels(activity).includes(Number(b.dataset.level)))return;data.levels[activity]=Number(b.dataset.level);save();newQuestion();return}if(b.hasAttribute('data-next')){newQuestion();return}if(b.hasAttribute('data-stop')){stopAudio();return}if(b.dataset.duration){answer=Number(b.dataset.duration);renderActivity();return}if(b.dataset.select){selected=Number(b.dataset.select);renderActivity();return}if(b.hasAttribute('data-select')){selected=0;renderActivity();return}if(b.dataset.note){answer[selected]=Number(b.dataset.note);const next=answer.findIndex((n,i)=>i>selected&&n===null);if(next>=0)selected=next;renderActivity();return}if(b.dataset.chord){answer=b.dataset.chord;renderActivity();return}if(b.hasAttribute('data-check')){check();return}if(b.hasAttribute('data-hint')){hint();return}if(b.hasAttribute('data-demo')){demo();return}if(b.hasAttribute('data-reveal')){reveal();return}if(b.hasAttribute('data-audition')){audition(Number(b.dataset.audition));return}if(b.hasAttribute('data-dismiss')){suggestion=null;$('suggestion').innerHTML='';return}if(b.dataset.play){const mode=b.dataset.play;if(mode==='target'||mode==='slow')playTarget(mode==='slow');else if(mode==='answer')sequence(answer.map((n,i)=>({notes:n,dur:1,slot:i})),90,true);else if(mode==='creation'||mode==='original')sequence((mode==='creation'?creative:[60,62,64,67,60,62,64,67]).map(n=>({notes:n,dur:1})));return}if(b.hasAttribute('data-save-creation')){const changed=creative[6]!==64||creative[7]!==67;if(!changed){$('creativeFeedback').className='feedback';$('creativeFeedback').textContent='Endre minst éin av dei to siste tonane for å lage ein variasjon.';return}if(data.creations.length>=30){$('creativeFeedback').className='feedback';$('creativeFeedback').textContent='Du har 30 lagra variantar. Eksporter ein kopi; denne prototypen har plass til 30.';return}data.creations.push({title:'Melodivariant '+(data.creations.length+1),notes:[...creative]});save();$('creativeFeedback').className='feedback good';$('creativeFeedback').textContent=storageOK?'Varianten er lagra i «Mi øving».':'Varianten er i denne økta. Eksporter framgangen for å ta vare på han.';return}if(b.hasAttribute('data-play-saved')){sequence(data.creations[Number(b.dataset.playSaved)].notes.map(n=>({notes:n,dur:1})));return}if(b.hasAttribute('data-open-saved')){creative=[...data.creations[Number(b.dataset.openSaved)].notes];go('create');return}if(b.hasAttribute('data-export'))exportData();if(b.hasAttribute('data-import'))$('importFile').click()});

$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>200000)throw Error('Fila er for stor.');const parsed=JSON.parse(await file.text());const legacyExtra=parsed.extraPractice===undefined;const legacyGroove=parsed.groovePractice===undefined;const legacyConversation=parsed.conversationPractice===undefined;const imported=validData(parsed);const importedTheme=imported.themeEnding===undefined?null:thValid(imported.themeEnding);if(legacyExtra&&!confirm(extraText('legacy')))return;if(!confirm('Import erstattar framgangen på denne eininga. Har du eksportert det du vil behalde?'))return;stopAudio();if(legacyGroove)imported.groovePractice=grValid(data.groovePractice);if(legacyConversation)imported.conversationPractice=cvValid(data.conversationPractice);delete imported.themeEnding;data=imported;storageCorrupt=false;cv.level=scLevel('conversation',data.conversationPractice.level);cv.item=null;if(scRouteAllowed('conversation'))cvNew();gr.level=scLevel('groove',data.groovePractice.level);grNew();pp.level=data.extraPractice.puzzle.level;nm.level=data.extraPractice.notation.level;ppNew();nmNew();if(importedTheme){thStore=importedTheme;thCorrupt=false;thPersist()}save();$('volume').value=data.volume*100;if(master)master.gain.value=data.volume*.22;go('progress');$('importFeedback').className='feedback good';$('importFeedback').textContent=!storageOK?grText('storage'):importedTheme&&!thSaveOK?thText('storage'):'Framgangen er importert.'}catch(err){go('progress');$('importFeedback').className='feedback warn';$('importFeedback').textContent='Kunne ikkje importere: '+err.message}finally{e.target.value=''}});
